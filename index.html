<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Boring Weather</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #111115;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            color: #fff;
            overflow: hidden;
            position: fixed;
            width: 100%; height: 100%;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }
        #canvas-3d {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }
        #ui {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 2;
            pointer-events: none;
            display: flex; flex-direction: column;
        }
        .top-bar {
            padding: 58px 20px 0;
            display: flex; align-items: center; justify-content: center;
        }
        .city {
            font-size: 12px; font-weight: 600;
            letter-spacing: 6px; opacity: 0.5; text-transform: uppercase;
        }
        .condition-label {
            text-align: center; font-size: 30px; font-weight: 700;
            letter-spacing: -0.5px; margin-top: auto; margin-bottom: 14px; padding: 0 20px;
        }
        #forecast-canvas {
            display: block; touch-action: none;
            pointer-events: auto; cursor: grab;
        }
        #forecast-canvas:active { cursor: grabbing; }
        .mode-hint {
            text-align: center; font-size: 9px;
            letter-spacing: 2px; opacity: 0.3;
            margin-top: 10px; margin-bottom: 28px;
            text-transform: uppercase; font-weight: 600;
        }
    </style>
</head>
<body>
<div id="ui">
    <div class="top-bar"><div class="city" id="city-name">GRÖDINGE</div></div>
    <div class="condition-label" id="condition-label"></div>
    <canvas id="forecast-canvas"></canvas>
    <div class="mode-hint" id="mode-hint">DAILY · DRAG ↕ TO ZOOM</div>
</div>
<canvas id="canvas-3d"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
<script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>
<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const API_KEY = 'dd6a890cc06c02cacd3ad1ec55e98bc6';
const FC_HEIGHT = 140;

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
const state = {
    hourly: [],
    daily:  [],
    zoom:   0,        // 0=daily, 1=hourly
    offsetX: 0,
    icons:  {},       // iconCode -> HTMLImageElement (resolved)
    myFont: null,
    centerCondition: '',
    centerTemp: 0,
    lastBeepCol: -1,
};

// ═══════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════
let audioCtx;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function beep(freq, dur, vol = 0.08) {
    try {
        const ac = getAudio();
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(vol, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        o.start(); o.stop(ac.currentTime + dur);
    } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// ICON LOADING  –  store actual Image elements, not promises
// ═══════════════════════════════════════════════════════
function loadIcon(code) {
    if (state.icons[code]) return; // already loaded or loading
    state.icons[code] = null; // mark as loading
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = () => { state.icons[code] = img; draw(); };
    img.onerror = () => { state.icons[code] = null; };
    img.src = `https://openweathermap.org/img/wn/${code}@2x.png`;
}

function preloadAllIcons() {
    [...state.hourly, ...state.daily].forEach(d => {
        const code = d.weather?.[0]?.icon;
        if (code) loadIcon(code);
    });
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function getData()  { return state.zoom > 0.5 ? state.hourly : state.daily; }
function getTemp(d) { return typeof d.temp === 'number' ? d.temp : (d.temp?.day ?? 0); }
function getColW() {
    const W = fc.width;
    return (state.zoom > 0.5) ? W / 5 : W / 8;
}
function getLabel(d, i) {
    const date = new Date(d.dt * 1000);
    if (state.zoom > 0.5) return i === 0 ? 'NOW' : String(date.getHours()).padStart(2,'0');
    return i === 0 ? 'TODAY' : date.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
}
function centerIndex() {
    const data = getData(), colW = getColW(), W = fc.width;
    if (!data.length) return 0;
    let best = 0, bestDist = Infinity;
    data.forEach((_, i) => {
        const x = W/2 + state.offsetX + i * colW;
        const d = Math.abs(x - W/2);
        if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
}
function clampOffset() {
    const data = getData(), colW = getColW(), W = fc.width;
    if (!data.length) return;
    const minOff = -(data.length - 1) * colW;
    const maxOff = 0;
    state.offsetX = Math.max(minOff, Math.min(maxOff, state.offsetX));
}

// ═══════════════════════════════════════════════════════
// DRAW FORECAST CANVAS  –  fully synchronous
// ═══════════════════════════════════════════════════════
const fc   = document.getElementById('forecast-canvas');
const ctx2 = fc.getContext('2d');

function resizeCanvas() {
    fc.width  = window.innerWidth;
    fc.height = FC_HEIGHT;
    draw();
}

function draw() {
    const W = fc.width, H = fc.height;
    ctx2.clearRect(0, 0, W, H);

    const data = getData();
    if (!data.length) return;

    const colW   = getColW();
    const PAD    = 16;
    const isHour = state.zoom > 0.5;

    // ── PILL BACKGROUND ──────────────────────────────
    const pX = PAD, pY = 6, pW = W - PAD*2, pH = H - 38;
    const pR = pH / 2;

    ctx2.beginPath();
    roundRect(ctx2, pX, pY, pW, pH, pR);
    ctx2.fillStyle = isHour
        ? `rgba(210,210,215,${0.15 + state.zoom * 0.77})`
        : 'rgba(255,255,255,0.07)';
    ctx2.fill();

    // ── CLIP to pill ─────────────────────────────────
    ctx2.save();
    ctx2.beginPath();
    roundRect(ctx2, pX, pY, pW, pH, pR);
    ctx2.clip();

    // ── TEMPERATURE RANGE ────────────────────────────
    const temps  = data.map(getTemp);
    const minT   = Math.min(...temps);
    const maxT   = Math.max(...temps);
    const tRange = Math.max(maxT - minT, 1);

    const cTop = pY + 30;
    const cBot = pY + pH - 34;
    const cH   = cBot - cTop;

    function tempY(t) { return cBot - ((t - minT) / tRange) * cH; }
    function colX(i)  { return W/2 + state.offsetX + i * colW; }

    // ── TEMPERATURE CURVE ────────────────────────────
    ctx2.beginPath();
    data.forEach((d, i) => {
        const x = colX(i), y = tempY(getTemp(d));
        i === 0 ? ctx2.moveTo(x, y) : ctx2.lineTo(x, y);
    });
    ctx2.strokeStyle = isHour ? 'rgba(0,0,0,0.3)' : 'rgba(255,255,255,0.3)';
    ctx2.lineWidth = 2;
    ctx2.lineJoin  = 'round';
    ctx2.lineCap   = 'round';
    ctx2.stroke();

    // ── COLUMNS ──────────────────────────────────────
    const ci = centerIndex();

    data.forEach((d, i) => {
        const x = colX(i);
        if (x < pX - colW || x > pX + pW + colW) return;

        const t    = getTemp(d);
        const y    = tempY(t);
        const dist = Math.abs(i - ci);
        const fade = Math.max(0.15, 1 - dist * 0.35);

        // Dot on curve
        ctx2.beginPath();
        ctx2.arc(x, y, dist === 0 ? 4 : 2.5, 0, Math.PI*2);
        ctx2.fillStyle = isHour
            ? `rgba(0,0,0,${dist === 0 ? 0.7 : 0.3})`
            : `rgba(255,255,255,${dist === 0 ? 0.9 : 0.4})`;
        ctx2.fill();

        // Weather icon
        const code = d.weather?.[0]?.icon;
        const img  = code ? state.icons[code] : null;
        const iconS = isHour ? 36 : 28;
        if (img) {
            ctx2.globalAlpha = fade;
            ctx2.drawImage(img, x - iconS/2, y - iconS - 6, iconS, iconS);
            ctx2.globalAlpha = 1;
        }

        // Temperature text
        const txtColor = isHour ? `rgba(0,0,0,${fade})` : `rgba(255,255,255,${fade})`;
        const txtSize  = (isHour && dist === 0) ? 30 : isHour ? 22 : 18;
        ctx2.fillStyle  = txtColor;
        ctx2.font       = `bold ${txtSize}px -apple-system, sans-serif`;
        ctx2.textAlign  = 'center';
        ctx2.textBaseline = 'middle';
        ctx2.fillText(`${Math.round(t)}°`, x, cBot + 16);
    });

    ctx2.restore();

    // ── TIME LABELS below pill ────────────────────────
    ctx2.textBaseline = 'top';
    ctx2.textAlign    = 'center';
    const labelY = pY + pH + 6;

    data.forEach((d, i) => {
        const x    = colX(i);
        if (x < PAD - colW || x > W - PAD + colW) return;
        const dist = Math.abs(i - ci);
        const fade = Math.max(0.2, 1 - dist * 0.3);
        ctx2.fillStyle = `rgba(255,255,255,${fade})`;
        ctx2.font      = `${dist === 0 ? 'bold' : '500'} 10px -apple-system, sans-serif`;
        ctx2.fillText(getLabel(d, i), x, labelY);
    });
}

// polyfill for roundRect in older browsers
function roundRect(c, x, y, w, h, r) {
    if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.arcTo(x + w, y, x + w, y + r, r);
    c.lineTo(x + w, y + h - r);
    c.arcTo(x + w, y + h, x + w - r, y + h, r);
    c.lineTo(x + r, y + h);
    c.arcTo(x, y + h, x, y + h - r, r);
    c.lineTo(x, y + r);
    c.arcTo(x, y, x + r, y, r);
    c.closePath();
}

// ═══════════════════════════════════════════════════════
// UPDATE CENTER (3D + label)
// ═══════════════════════════════════════════════════════
function updateCenter() {
    const data = getData();
    if (!data.length) return;

    const i    = centerIndex();
    const d    = data[i];
    const temp = Math.round(getTemp(d));
    const cond = d.weather?.[0]?.main ?? 'Clear';

    if (cond !== state.centerCondition || temp !== state.centerTemp) {
        state.centerCondition = cond;
        state.centerTemp      = temp;
        document.getElementById('condition-label').textContent = cond;
        draw3DWeather(cond, temp);
    }

    const hint = state.zoom < 0.3 ? 'DAILY · DRAG ↕ TO ZOOM IN'
               : state.zoom > 0.7 ? 'HOURLY · DRAG ↕ TO ZOOM OUT'
               : 'ZOOMING…';
    document.getElementById('mode-hint').textContent = hint;
}

// ═══════════════════════════════════════════════════════
// GESTURE HANDLING
// ═══════════════════════════════════════════════════════
let gActive = false, gType = null;
let gStartX = 0, gStartY = 0;
let gStartOff = 0, gStartZoom = 0;

function gStart(x, y) {
    gActive = true; gType = null;
    gStartX = x; gStartY = y;
    gStartOff  = state.offsetX;
    gStartZoom = state.zoom;
    beep(700, 0.06);
}

function gMove(x, y) {
    if (!gActive) return;
    const dx = x - gStartX, dy = y - gStartY;

    if (!gType && (Math.abs(dx) > 6 || Math.abs(dy) > 6))
        gType = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';

    if (gType === 'h') {
        state.offsetX = gStartOff + dx;
        clampOffset();
        // tick sound per column
        const col = Math.round(-state.offsetX / getColW());
        if (col !== state.lastBeepCol) {
            state.lastBeepCol = col;
            beep(550, 0.04, 0.06);
        }
    } else if (gType === 'v') {
        state.zoom = Math.max(0, Math.min(1, gStartZoom - dy / 160));
        // reset pan when crossing threshold
        if ((state.zoom > 0.5) !== (gStartZoom > 0.5)) {
            state.offsetX = 0;
            gStartOff = 0;
        }
        beep(350 + state.zoom * 350, 0.06, 0.05);
    }

    draw();
    updateCenter();
}

function gEnd() {
    if (!gActive) return;
    gActive = false; gType = null;
    // snap zoom
    const target = state.zoom > 0.5 ? 1 : 0;
    snapZoom(target);
}

function snapZoom(target) {
    const from = state.zoom;
    const t0   = performance.now();
    const dur  = 280;
    (function step(now) {
        const p = Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3); // ease out cubic
        state.zoom = from + (target - from) * e;
        clampOffset();
        draw();
        updateCenter();
        if (p < 1) requestAnimationFrame(step);
    })(t0);
}

// Touch
fc.addEventListener('touchstart', e => { e.preventDefault(); gStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
fc.addEventListener('touchmove',  e => { e.preventDefault(); gMove(e.touches[0].clientX,  e.touches[0].clientY);  }, {passive:false});
fc.addEventListener('touchend',   e => { e.preventDefault(); gEnd(); }, {passive:false});

// Mouse
fc.addEventListener('mousedown',  e => gStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e => gMove(e.clientX, e.clientY));
window.addEventListener('mouseup',   () => gEnd());

// ═══════════════════════════════════════════════════════
// WEATHER DATA
// ═══════════════════════════════════════════════════════
async function fetchWeather(lat, lon) {
    try {
        const [curr, oc] = await Promise.all([
            fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`).then(r=>r.json()),
            fetch(`https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&exclude=minutely,alerts`).then(r=>r.json()),
        ]);

        document.getElementById('city-name').textContent = (curr.name || 'WEATHER').toUpperCase();
        state.hourly = oc.hourly?.slice(0,24) ?? [];
        state.daily  = oc.daily?.slice(0,8)   ?? [];

        const temp = Math.round(curr.main.temp);
        const cond = curr.weather[0].main;
        state.centerCondition = cond;
        state.centerTemp      = temp;
        document.getElementById('condition-label').textContent = cond;
        draw3DWeather(cond, temp);

        preloadAllIcons(); // loads icons and redraws on each load
        draw();
        updateCenter();

    } catch(err) {
        console.warn('API failed, using mock data', err);
        const now = Date.now()/1000;
        const icons = ['04n','04d','02d','10d','13d'];
        state.hourly = Array.from({length:24},(_,i)=>({
            dt: now+i*3600, temp: -5+Math.sin(i*0.4)*6,
            weather:[{icon:icons[i%5],main:'Clouds'}]
        }));
        state.daily = Array.from({length:8},(_,i)=>({
            dt: now+i*86400,
            temp:{day:-3+i*0.8, min:-13+i, max:-1+i},
            weather:[{icon:icons[i%5],main:'Clouds'}]
        }));
        state.centerCondition = 'Clouds';
        state.centerTemp = -2;
        document.getElementById('condition-label').textContent = 'Clouds';
        draw3DWeather('Clouds', -2);
        preloadAllIcons();
        draw();
        updateCenter();
    }
}

function startFetch() {
    navigator.geolocation.getCurrentPosition(
        p => fetchWeather(p.coords.latitude, p.coords.longitude),
        ()  => fetchWeather(59.1936, 17.3654),
        {timeout:5000}
    );
}

// ═══════════════════════════════════════════════════════
// THREE.JS 3D SCENE
// ═══════════════════════════════════════════════════════
let scene3, cam3, ren3, grp3;
let drag3 = false, lastAct = Date.now(), zoom3 = 1;

function createMat() {
    const cv = document.createElement('canvas');
    cv.width = cv.height = 512;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#3a3a40';
    cx.fillRect(0,0,512,512);
    const id = cx.getImageData(0,0,512,512);
    for (let i=0;i<id.data.length;i+=4) {
        const n = (Math.random()-.5)*35;
        id.data[i]   = Math.max(0,Math.min(255,58+n));
        id.data[i+1] = Math.max(0,Math.min(255,58+n));
        id.data[i+2] = Math.max(0,Math.min(255,64+n));
        id.data[i+3] = 255;
    }
    cx.putImageData(id,0,0);
    const tex = new THREE.CanvasTexture(cv);
    return new THREE.MeshStandardMaterial({map:tex,roughness:.95,metalness:.05,bumpMap:tex,bumpScale:.4,color:0x3a3a40});
}

function draw3DWeather(cond, temp) {
    if (!grp3 || !state.myFont) return;
    while (grp3.children.length) grp3.remove(grp3.children[0]);

    const mat = createMat();

    // Cloud
    const cloud = new THREE.Group();
    [{x:0,y:0,z:0,r:5},{x:-4.5,y:0,z:-1,r:4},{x:4.5,y:0,z:-1,r:4},
     {x:-2,y:3,z:0,r:3.5},{x:2,y:3,z:0,r:3.5},{x:-6,y:-1,z:1,r:2},{x:6,y:-1,z:1,r:2}]
    .forEach(p=>{
        const m = new THREE.Mesh(new THREE.SphereGeometry(p.r,32,32),mat);
        m.position.set(p.x,p.y,p.z); m.castShadow=true; cloud.add(m);
    });
    cloud.position.set(0,5,0);
    grp3.add(cloud);

    // Number
    const tg = new THREE.TextGeometry(String(temp),{
        font:state.myFont,size:14,height:3,curveSegments:12,
        bevelEnabled:true,bevelThickness:.3,bevelSize:.2,bevelSegments:5
    });
    tg.center();
    const tm = new THREE.Mesh(tg,mat);
    tm.position.set(0,-8,0); tm.castShadow=true; grp3.add(tm);

    // Degree
    const dg = new THREE.TextGeometry('°',{font:state.myFont,size:6,height:2,curveSegments:12,bevelEnabled:true,bevelThickness:.2,bevelSize:.1,bevelSegments:5});
    const dm = new THREE.Mesh(dg,mat);
    dm.position.set(11,-5,0); grp3.add(dm);

    // Condition
    const cg = new THREE.TextGeometry(cond.toUpperCase(),{
        font:state.myFont,size:4,height:1.5,curveSegments:8,
        bevelEnabled:true,bevelThickness:.15,bevelSize:.1,bevelSegments:3
    });
    cg.center();
    const cm = new THREE.Mesh(cg,mat);
    cm.position.set(0,-18,0); cm.castShadow=true; grp3.add(cm);
}

function init3D() {
    const canvas = document.getElementById('canvas-3d');
    scene3 = new THREE.Scene();
    cam3   = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 1, 1000);
    cam3.position.set(0,0,65);
    ren3 = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
    ren3.setSize(innerWidth,innerHeight);
    ren3.setPixelRatio(Math.min(devicePixelRatio,2));
    ren3.shadowMap.enabled = true;

    scene3.add(new THREE.AmbientLight(0xffffff,.5));
    const ml = new THREE.DirectionalLight(0xffffff,1.2);
    ml.position.set(10,20,15); ml.castShadow=true; scene3.add(ml);
    const fl = new THREE.DirectionalLight(0x8888ff,.4);
    fl.position.set(-15,-10,10); scene3.add(fl);
    const rl = new THREE.DirectionalLight(0xffffff,.5);
    rl.position.set(-5,5,-10); scene3.add(rl);

    grp3 = new THREE.Group();
    scene3.add(grp3);

    // 3D controls
    const c3 = document.getElementById('canvas-3d');
    let prev = {x:0,y:0}, ld = 0;

    c3.addEventListener('mousedown', e=>{drag3=true; prev={x:e.clientX,y:e.clientY};});
    window.addEventListener('mousemove', e=>{
        if(!drag3) return;
        grp3.rotation.y += (e.clientX-prev.x)*.01;
        grp3.rotation.x = Math.max(-Math.PI/4,Math.min(Math.PI/4,grp3.rotation.x+(e.clientY-prev.y)*.01));
        prev={x:e.clientX,y:e.clientY}; lastAct=Date.now();
    });
    window.addEventListener('mouseup',()=>drag3=false);
    c3.addEventListener('wheel',e=>{
        e.preventDefault();
        zoom3=Math.max(.5,Math.min(2.5,zoom3+(e.deltaY>0?-1:1)*.05));
        grp3.scale.setScalar(zoom3); lastAct=Date.now();
    },{passive:false});

    c3.addEventListener('touchstart',e=>{
        if(e.touches.length===1){drag3=true; prev={x:e.touches[0].clientX,y:e.touches[0].clientY};}
        if(e.touches.length===2){
            drag3=false;
            const dx=e.touches[0].clientX-e.touches[1].clientX;
            const dy=e.touches[0].clientY-e.touches[1].clientY;
            ld=Math.sqrt(dx*dx+dy*dy);
        }
    });
    c3.addEventListener('touchmove',e=>{
        if(e.touches.length===1&&drag3){
            const t=e.touches[0];
            grp3.rotation.y+=(t.clientX-prev.x)*.01;
            grp3.rotation.x=Math.max(-Math.PI/4,Math.min(Math.PI/4,grp3.rotation.x+(t.clientY-prev.y)*.01));
            prev={x:t.clientX,y:t.clientY}; lastAct=Date.now();
        }
        if(e.touches.length===2){
            e.preventDefault();
            const dx=e.touches[0].clientX-e.touches[1].clientX;
            const dy=e.touches[0].clientY-e.touches[1].clientY;
            const dist=Math.sqrt(dx*dx+dy*dy);
            if(ld>0){zoom3=Math.max(.5,Math.min(2.5,zoom3*(1+(dist-ld)*.005)));grp3.scale.setScalar(zoom3);}
            ld=dist; lastAct=Date.now();
        }
    },{passive:false});
    c3.addEventListener('touchend',()=>{drag3=false;ld=0;});

    window.addEventListener('resize',()=>{
        cam3.aspect=innerWidth/innerHeight; cam3.updateProjectionMatrix();
        ren3.setSize(innerWidth,innerHeight); resizeCanvas();
    });

    // Load font, then fetch weather
    new THREE.FontLoader().load(
        'https://threejs.org/examples/fonts/helvetiker_bold.typeface.json',
        font => { state.myFont = font; startFetch(); }
    );

    // Animate
    (function loop() {
        requestAnimationFrame(loop);
        if(!drag3 && Date.now()-lastAct>2000) grp3.rotation.y+=.0008;
        ren3.render(scene3,cam3);
    })();
}

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
resizeCanvas();
init3D();
</script>
</body>
</html>
