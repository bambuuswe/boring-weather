<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Boring Weather</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1f;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            touch-action: pan-y;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        
        .top-bar {
            padding: 60px 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .city {
            letter-spacing: 6px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.6;
            text-transform: uppercase;
        }

        /* Forecast Bar Container */
        .forecast-container {
            margin-top: auto;
            padding-bottom: 30px;
            pointer-events: auto;
            position: relative;
        }
        
        /* Mode indicator */
        .mode-indicator {
            text-align: center;
            font-size: 11px;
            letter-spacing: 1px;
            opacity: 0.5;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 500;
        }
        
        /* The scrubbing bar */
        .scrub-bar {
            position: relative;
            height: 100px;
            margin: 0 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            overflow: hidden;
            touch-action: none;
            cursor: grab;
        }
        
        .scrub-bar:active {
            cursor: grabbing;
        }
        
        /* Background gradient based on time of day */
        .scrub-background {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        
        /* The items track (all items laid out) */
        .scrub-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            z-index: 2;
            pointer-events: none;
        }
        
        /* Individual forecast item in track */
        .scrub-item {
            flex-shrink: 0;
            width: 60px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0.3;
            transition: opacity 0.2s ease, transform 0.2s ease;
            position: relative;
        }
        
        .scrub-item.near-center {
            opacity: 0.6;
        }
        
        .scrub-item.active {
            opacity: 1;
            transform: scale(1.1);
        }
        
        .scrub-time {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .scrub-icon {
            width: 32px;
            height: 32px;
        }
        
        .scrub-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .scrub-temp {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.5px;
        }
        
        .scrub-item.active .scrub-temp {
            font-weight: 600;
            font-size: 17px;
        }
        
        /* Rain indicator */
        .scrub-rain {
            font-size: 9px;
            color: #4a9eff;
            opacity: 0.8;
        }
        
        /* Center indicator line */
        .center-indicator {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.5);
            transform: translateX(-50%);
            z-index: 3;
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        .center-indicator::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: #4a9eff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(74, 158, 255, 0.8);
        }
        
        /* Swipe hint */
        .swipe-hint {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            opacity: 0.4;
            letter-spacing: 0.5px;
            white-space: nowrap;
            animation: fadeInOut 3s ease-in-out infinite;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="top-bar">
            <div class="city" id="city-name">GRÖDINGE</div>
        </div>

        <div class="forecast-container">
            <div class="mode-indicator" id="mode-indicator">HOURLY</div>
            <div class="scrub-bar" id="scrub-bar">
                <canvas class="scrub-background" id="scrub-bg"></canvas>
                <div class="scrub-track" id="scrub-track"></div>
                <div class="center-indicator"></div>
                <div class="swipe-hint">↕ swipe to change mode</div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
    <script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>

    <script>
        const API_KEY = 'dd6a890cc06c02cacd3ad1ec55e98bc6';
        let scene, camera, renderer, mainGroup;
        let isDragging = false, lastInteraction = Date.now();
        let currentZoom = 1;
        let forecastData = { hourly: [], daily: [] };
        let currentMode = 'hourly';
        let myFont = null;

        // Enhanced sound system
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        
        const sounds = {
            tap: () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.1);
            },
            swipe: () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.15);
            },
            toggle: () => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.08);
            }
        };
        
        function playSound(soundName) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (sounds[soundName]) {
                try {
                    sounds[soundName]();
                } catch (e) {
                    console.log('Sound error:', e);
                }
            }
        }

        // Create grainy material
        function createGrainyMaterial() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#3a3a40';
            ctx.fillRect(0, 0, 512, 512);
            
            const imageData = ctx.getImageData(0, 0, 512, 512);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 35;
                data[i] = Math.max(0, Math.min(255, 58 + noise));
                data[i + 1] = Math.max(0, Math.min(255, 58 + noise));
                data[i + 2] = Math.max(0, Math.min(255, 64 + noise));
                data[i + 3] = 255;
            }
            ctx.putImageData(imageData, 0, 0);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            
            return new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.95,
                metalness: 0.05,
                bumpMap: texture,
                bumpScale: 0.4,
                color: 0x3a3a40
            });
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 0, 65);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(10, 20, 15);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
            fillLight.position.set(-15, -10, 10);
            scene.add(fillLight);
            
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
            rimLight.position.set(-5, 5, -10);
            scene.add(rimLight);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            setupEvents();
            
            new THREE.FontLoader().load(
                'https://threejs.org/examples/fonts/helvetiker_bold.typeface.json',
                font => {
                    myFont = font;
                    fetchData();
                    animate();
                }
            );
        }

        async function fetchData() {
            try {
                navigator.geolocation.getCurrentPosition(
                    pos => fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude),
                    () => fetchWeatherByCoords(59.1936, 17.3654)
                );
            } catch (e) {
                fetchWeatherByCoords(59.1936, 17.3654);
            }
        }

        async function fetchWeatherByCoords(lat, lon) {
            try {
                const current = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=sv`
                ).then(r => r.json());
                
                const oneCall = await fetch(
                    `https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=sv&exclude=minutely,alerts`
                ).then(r => r.json());

                if (current && current.main) {
                    document.getElementById('city-name').textContent = current.name.toUpperCase();
                    
                    const temp = Math.round(current.main.temp);
                    const condition = current.weather[0].main;
                    drawWeather(condition, temp);
                    
                    if (oneCall) {
                        forecastData.hourly = oneCall.hourly ? oneCall.hourly.slice(0, 24) : [];
                        forecastData.daily = oneCall.daily ? oneCall.daily.slice(0, 7) : [];
                        buildForecastBar(currentMode);
                    }
                }
            } catch (e) {
                console.error('Weather error:', e);
                const fallback = { dt: Date.now()/1000, temp: -2, weather: [{icon: '04n', main: 'Clouds'}] };
                forecastData.hourly = [fallback];
                forecastData.daily = [fallback];
                drawWeather('Clouds', -2);
                buildForecastBar('hourly');
            }
        }

        function drawWeather(condition, temp) {
            while(mainGroup.children.length > 0) {
                mainGroup.remove(mainGroup.children[0]);
            }
            
            if (!myFont) return;
            
            const material = createGrainyMaterial();
            
            const cloud = createCloud(material);
            cloud.position.set(0, 5, 0);
            mainGroup.add(cloud);
            
            const tempGeometry = new THREE.TextGeometry(temp.toString(), {
                font: myFont,
                size: 14,
                height: 3,
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.3,
                bevelSize: 0.2,
                bevelSegments: 5
            });
            tempGeometry.center();
            const tempMesh = new THREE.Mesh(tempGeometry, material);
            tempMesh.position.set(0, -8, 0);
            tempMesh.castShadow = true;
            mainGroup.add(tempMesh);
            
            const degreeGeometry = new THREE.TextGeometry('°', {
                font: myFont,
                size: 6,
                height: 2,
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.2,
                bevelSize: 0.1,
                bevelSegments: 5
            });
            const degreeMesh = new THREE.Mesh(degreeGeometry, material);
            degreeMesh.position.set(10, -5, 0);
            degreeMesh.castShadow = true;
            mainGroup.add(degreeMesh);
            
            const conditionGeometry = new THREE.TextGeometry(condition.toUpperCase(), {
                font: myFont,
                size: 4,
                height: 1.5,
                curveSegments: 8,
                bevelEnabled: true,
                bevelThickness: 0.15,
                bevelSize: 0.1,
                bevelSegments: 3
            });
            conditionGeometry.center();
            const conditionMesh = new THREE.Mesh(conditionGeometry, material);
            conditionMesh.position.set(0, -18, 0);
            conditionMesh.castShadow = true;
            mainGroup.add(conditionMesh);
        }

        function createCloud(material) {
            const group = new THREE.Group();
            
            const positions = [
                { x: 0, y: 0, z: 0, r: 5 },
                { x: -4.5, y: 0, z: -1, r: 4 },
                { x: 4.5, y: 0, z: -1, r: 4 },
                { x: -2, y: 3, z: 0, r: 3.5 },
                { x: 2, y: 3, z: 0, r: 3.5 },
                { x: -6, y: -1, z: 1, r: 2 },
                { x: 6, y: -1, z: 1, r: 2 }
            ];
            
            positions.forEach(pos => {
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(pos.r, 32, 32),
                    material
                );
                sphere.position.set(pos.x, pos.y, pos.z);
                sphere.castShadow = true;
                group.add(sphere);
            });
            
            return group;
        }

        function buildForecastBar(mode) {
            currentMode = mode;
            document.getElementById('mode-indicator').textContent = mode.toUpperCase();
            
            const track = document.getElementById('scrub-track');
            const bar = document.getElementById('scrub-bar');
            const bgCanvas = document.getElementById('scrub-bg');
            
            track.innerHTML = '';
            
            const data = mode === 'hourly' ? forecastData.hourly : forecastData.daily;
            if (!data || !data.length) return;
            
            // Setup background canvas
            bgCanvas.width = bar.offsetWidth;
            bgCanvas.height = bar.offsetHeight;
            const ctx = bgCanvas.getContext('2d');
            
            // Draw gradient based on time of day
            const gradient = ctx.createLinearGradient(0, 0, bgCanvas.width, 0);
            data.forEach((item, i) => {
                const date = new Date(item.dt * 1000);
                const hour = date.getHours();
                const position = i / Math.max(data.length - 1, 1);
                
                let color;
                if (hour >= 6 && hour < 8) {
                    color = `rgba(255, 150, 100, 0.2)`;
                } else if (hour >= 8 && hour < 18) {
                    color = `rgba(100, 150, 255, 0.15)`;
                } else if (hour >= 18 && hour < 20) {
                    color = `rgba(200, 100, 255, 0.2)`;
                } else {
                    color = `rgba(50, 50, 100, 0.25)`;
                }
                
                gradient.addColorStop(position, color);
            });
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            // Build all forecast items
            const itemWidth = 60;
            const totalWidth = data.length * itemWidth;
            track.style.width = `${totalWidth}px`;
            
            data.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'scrub-item';
                el.dataset.index = i;
                
                const date = new Date(item.dt * 1000);
                let timeLabel;
                
                if (mode === 'hourly') {
                    timeLabel = String(date.getHours()).padStart(2, '0') + ':00';
                } else {
                    timeLabel = date.toLocaleDateString('sv-SE', { weekday: 'short' }).toUpperCase();
                }
                
                const temp = item.temp ? (typeof item.temp === 'number' ? Math.round(item.temp) : Math.round(item.temp.day)) : 0;
                const icon = item.weather && item.weather[0] ? item.weather[0].icon : '01d';
                const pop = item.pop ? Math.round(item.pop * 100) : 0;
                
                el.innerHTML = `
                    <div class="scrub-time">${timeLabel}</div>
                    <div class="scrub-icon">
                        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt=""/>
                    </div>
                    <div class="scrub-temp">${temp}°</div>
                    ${pop > 0 ? `<div class="scrub-rain">${pop}%</div>` : ''}
                `;
                
                track.appendChild(el);
            });
            
            // Initialize scrubbing
            let currentPosition = 0;
            updateScrubPosition(0);
            
            // Scrubbing interaction
            let isScrubbing = false;
            let scrubStartX = 0;
            let scrubStartPosition = 0;
            
            function updateScrubPosition(offsetX) {
                const barWidth = bar.offsetWidth;
                const centerOffset = barWidth / 2;
                
                // Calculate scroll position
                const scrollPosition = -offsetX + centerOffset;
                track.style.transform = `translateX(${scrollPosition}px)`;
                
                // Find which item is at center
                const centerX = -scrollPosition + centerOffset;
                const centerIndex = Math.max(0, Math.min(data.length - 1, Math.round(centerX / itemWidth)));
                
                // Update active states
                const items = track.querySelectorAll('.scrub-item');
                items.forEach((item, i) => {
                    const distance = Math.abs(i - centerIndex);
                    item.classList.remove('active', 'near-center');
                    
                    if (i === centerIndex) {
                        item.classList.add('active');
                        
                        // Update 3D scene
                        const itemData = data[i];
                        if (itemData) {
                            const temp = itemData.temp ? (typeof itemData.temp === 'number' ? Math.round(itemData.temp) : Math.round(itemData.temp.day)) : 0;
                            const condition = itemData.weather && itemData.weather[0] ? itemData.weather[0].main : 'Clear';
                            drawWeather(condition, temp);
                        }
                    } else if (distance === 1) {
                        item.classList.add('near-center');
                    }
                });
                
                currentPosition = offsetX;
            }
            
            function handleScrubStart(clientX) {
                isScrubbing = true;
                bar.style.cursor = 'grabbing';
                scrubStartX = clientX;
                scrubStartPosition = currentPosition;
                playSound('tap');
            }
            
            function handleScrubMove(clientX) {
                if (!isScrubbing) return;
                const deltaX = clientX - scrubStartX;
                const newPosition = scrubStartPosition + deltaX;
                
                // Constrain position
                const maxPosition = totalWidth - bar.offsetWidth / 2;
                const minPosition = -bar.offsetWidth / 2;
                const constrainedPosition = Math.max(minPosition, Math.min(maxPosition, newPosition));
                
                updateScrubPosition(constrainedPosition);
                
                // Play scrub sound occasionally
                if (Math.abs(deltaX) % 20 < 2) {
                    playSound('swipe');
                }
            }
            
            function handleScrubEnd() {
                if (isScrubbing) {
                    isScrubbing = false;
                    bar.style.cursor = 'grab';
                }
            }
            
            // Mouse events
            bar.addEventListener('mousedown', (e) => handleScrubStart(e.clientX));
            window.addEventListener('mousemove', (e) => handleScrubMove(e.clientX));
            window.addEventListener('mouseup', handleScrubEnd);
            
            // Touch events for scrubbing
            bar.addEventListener('touchstart', (e) => {
                handleScrubStart(e.touches[0].clientX);
            }, { passive: true });
            
            bar.addEventListener('touchmove', (e) => {
                handleScrubMove(e.touches[0].clientX);
            }, { passive: true });
            
            bar.addEventListener('touchend', handleScrubEnd, { passive: true });
        }

        // Vertical swipe to change modes
        let verticalSwipeStartY = 0;
        let verticalSwipeStartX = 0;
        const forecastContainer = document.querySelector('.forecast-container');
        
        forecastContainer.addEventListener('touchstart', (e) => {
            verticalSwipeStartY = e.touches[0].clientY;
            verticalSwipeStartX = e.touches[0].clientX;
        }, { passive: true });
        
        forecastContainer.addEventListener('touchend', (e) => {
            const deltaY = e.changedTouches[0].clientY - verticalSwipeStartY;
            const deltaX = Math.abs(e.changedTouches[0].clientX - verticalSwipeStartX);
            
            // Only trigger if vertical swipe is dominant
            if (Math.abs(deltaY) > 50 && deltaX < 30) {
                playSound('toggle');
                
                if (deltaY < 0) {
                    // Swipe up - go to hourly
                    if (currentMode !== 'hourly') {
                        buildForecastBar('hourly');
                    }
                } else {
                    // Swipe down - go to daily
                    if (currentMode !== 'daily') {
                        buildForecastBar('daily');
                    }
                }
            }
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            
            if (!isDragging && Date.now() - lastInteraction > 2000) {
                mainGroup.rotation.y += 0.001;
                mainGroup.rotation.x *= 0.99;
            }
            
            renderer.render(scene, camera);
        }

        function setupEvents() {
            let prev = { x: 0, y: 0 };
            const container = document.getElementById('canvas-container');
            
            const start = (x, y) => {
                isDragging = true;
                prev = { x, y };
            };
            
            const move = (x, y) => {
                if (!isDragging) return;
                mainGroup.rotation.y += (x - prev.x) * 0.01;
                mainGroup.rotation.x += (y - prev.y) * 0.01;
                mainGroup.rotation.x = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, mainGroup.rotation.x));
                prev = { x, y };
                lastInteraction = Date.now();
            };
            
            container.addEventListener('mousedown', e => start(e.clientX, e.clientY));
            window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
            window.addEventListener('mouseup', () => isDragging = false);
            
            container.addEventListener('touchstart', e => {
                if (e.touches.length === 1) {
                    start(e.touches[0].clientX, e.touches[0].clientY);
                }
            });
            
            container.addEventListener('touchmove', e => {
                if (e.touches.length === 1) {
                    move(e.touches[0].clientX, e.touches[0].clientY);
                }
            });
            
            window.addEventListener('touchend', () => isDragging = false);
            
            container.addEventListener('wheel', e => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -1 : 1;
                currentZoom += delta * 0.05;
                currentZoom = Math.max(0.5, Math.min(2, currentZoom));
                mainGroup.scale.set(currentZoom, currentZoom, currentZoom);
                lastInteraction = Date.now();
            }, { passive: false });
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                
                // Rebuild forecast bar on resize
                if (forecastData.hourly.length > 0 || forecastData.daily.length > 0) {
                    setTimeout(() => buildForecastBar(currentMode), 100);
                }
            });
        }

        init();
    </script>
</body>
</html>
