<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Boring Weather</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1f;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        #ui {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        
        .top-bar {
            padding: 60px 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .city {
            letter-spacing: 6px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0.5;
            text-transform: uppercase;
        }

        /* Forecast Container */
        .forecast-container {
            margin-top: auto;
            padding: 0 20px 40px 20px;
            pointer-events: auto;
            position: relative;
        }
        
        /* Condition label above forecast */
        .condition-label {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }
        
        /* Daily forecast - simple horizontal row */
        .daily-forecast {
            display: none;
        }
        
        .daily-forecast.active {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        
        .daily-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        
        .daily-day {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0.6;
            text-transform: uppercase;
        }
        
        .daily-icon {
            width: 32px;
            height: 32px;
        }
        
        .daily-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .daily-high {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .daily-low {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.5;
            letter-spacing: -0.3px;
        }
        
        /* Hourly forecast - pill slider */
        .hourly-forecast {
            display: none;
        }
        
        .hourly-forecast.active {
            display: block;
        }
        
        /* The big pill-shaped slider */
        .hourly-slider {
            position: relative;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            overflow: hidden;
            touch-action: pan-x;
            cursor: grab;
            margin-bottom: 12px;
        }
        
        .hourly-slider:active {
            cursor: grabbing;
        }
        
        /* Temperature values inside the slider */
        .slider-temps {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            align-items: center;
            transition: transform 0.1s ease-out;
        }
        
        .slider-temp {
            width: 100px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -1px;
        }
        
        .slider-temp.active {
            font-size: 36px;
            color: #000000;
        }
        
        /* Time labels below slider */
        .hourly-times {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }
        
        .hourly-time {
            font-size: 11px;
            font-weight: 500;
            opacity: 0.4;
            letter-spacing: 0.5px;
        }
        
        .hourly-time.active {
            opacity: 1;
            font-weight: 700;
        }
        
        /* Swipe hint */
        .swipe-hint {
            text-align: center;
            font-size: 9px;
            opacity: 0.25;
            margin-top: 16px;
            letter-spacing: 1px;
            animation: pulse 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.35; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="top-bar">
            <div class="city" id="city-name">GRÖDINGE</div>
        </div>

        <div class="forecast-container" id="forecast-container">
            <div class="condition-label" id="condition-label">Cloudy</div>
            
            <!-- Daily Forecast -->
            <div class="daily-forecast" id="daily-forecast"></div>
            
            <!-- Hourly Forecast -->
            <div class="hourly-forecast" id="hourly-forecast">
                <div class="hourly-slider" id="hourly-slider">
                    <div class="slider-temps" id="slider-temps"></div>
                </div>
                <div class="hourly-times" id="hourly-times"></div>
            </div>
            
            <div class="swipe-hint">↕ swipe to toggle view</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
    <script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>

    <script>
        const API_KEY = 'dd6a890cc06c02cacd3ad1ec55e98bc6';
        let scene, camera, renderer, mainGroup;
        let isDragging = false, lastInteraction = Date.now();
        let currentZoom = 1;
        let forecastData = { hourly: [], daily: [] };
        let currentMode = 'hourly';
        let myFont = null;

        // Sound system
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function playTap() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 800;
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.08);
        }
        
        function playSwipe() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.12);
        }

        // Material
        function createGrainyMaterial() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#3a3a40';
            ctx.fillRect(0, 0, 512, 512);
            
            const imageData = ctx.getImageData(0, 0, 512, 512);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 35;
                data[i] = Math.max(0, Math.min(255, 58 + noise));
                data[i + 1] = Math.max(0, Math.min(255, 58 + noise));
                data[i + 2] = Math.max(0, Math.min(255, 64 + noise));
                data[i + 3] = 255;
            }
            ctx.putImageData(imageData, 0, 0);
            
            const texture = new THREE.CanvasTexture(canvas);
            
            return new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.95,
                metalness: 0.05,
                bumpMap: texture,
                bumpScale: 0.4,
                color: 0x3a3a40
            });
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 0, 65);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(10, 20, 15);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
            fillLight.position.set(-15, -10, 10);
            scene.add(fillLight);
            
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
            rimLight.position.set(-5, 5, -10);
            scene.add(rimLight);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            setup3DInteraction();
            
            new THREE.FontLoader().load(
                'https://threejs.org/examples/fonts/helvetiker_bold.typeface.json',
                font => {
                    myFont = font;
                    fetchData();
                    animate();
                }
            );
        }

        async function fetchData() {
            try {
                navigator.geolocation.getCurrentPosition(
                    pos => fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude),
                    () => fetchWeatherByCoords(59.1936, 17.3654)
                );
            } catch (e) {
                fetchWeatherByCoords(59.1936, 17.3654);
            }
        }

        async function fetchWeatherByCoords(lat, lon) {
            try {
                const current = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=sv`
                ).then(r => r.json());
                
                const oneCall = await fetch(
                    `https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&lang=sv&exclude=minutely,alerts`
                ).then(r => r.json());

                if (current && current.main) {
                    document.getElementById('city-name').textContent = current.name.toUpperCase();
                    
                    const temp = Math.round(current.main.temp);
                    const condition = current.weather[0].main;
                    drawWeather(condition, temp);
                    
                    if (oneCall) {
                        forecastData.hourly = oneCall.hourly ? oneCall.hourly.slice(0, 24) : [];
                        forecastData.daily = oneCall.daily ? oneCall.daily.slice(0, 8) : [];
                        
                        buildDailyForecast();
                        buildHourlyForecast();
                        
                        // Start with daily view
                        switchToDaily();
                    }
                }
            } catch (e) {
                console.error('Weather error:', e);
                const fallback = { dt: Date.now()/1000, temp: -2, weather: [{icon: '04n', main: 'Clouds'}] };
                forecastData.hourly = [fallback];
                forecastData.daily = [{ ...fallback, temp: { day: -2, min: -13, max: -2 } }];
                drawWeather('Clouds', -2);
                buildDailyForecast();
                buildHourlyForecast();
                switchToDaily();
            }
        }

        function drawWeather(condition, temp) {
            while(mainGroup.children.length > 0) {
                mainGroup.remove(mainGroup.children[0]);
            }
            
            if (!myFont) return;
            
            const material = createGrainyMaterial();
            
            const cloud = createCloud(material);
            cloud.position.set(0, 5, 0);
            mainGroup.add(cloud);
            
            const tempGeometry = new THREE.TextGeometry(temp.toString(), {
                font: myFont,
                size: 14,
                height: 3,
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.3,
                bevelSize: 0.2,
                bevelSegments: 5
            });
            tempGeometry.center();
            const tempMesh = new THREE.Mesh(tempGeometry, material);
            tempMesh.position.set(0, -8, 0);
            tempMesh.castShadow = true;
            mainGroup.add(tempMesh);
            
            const degreeGeometry = new THREE.TextGeometry('°', {
                font: myFont,
                size: 6,
                height: 2,
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.2,
                bevelSize: 0.1,
                bevelSegments: 5
            });
            const degreeMesh = new THREE.Mesh(degreeGeometry, material);
            degreeMesh.position.set(10, -5, 0);
            degreeMesh.castShadow = true;
            mainGroup.add(degreeMesh);
            
            const conditionGeometry = new THREE.TextGeometry(condition.toUpperCase(), {
                font: myFont,
                size: 4,
                height: 1.5,
                curveSegments: 8,
                bevelEnabled: true,
                bevelThickness: 0.15,
                bevelSize: 0.1,
                bevelSegments: 3
            });
            conditionGeometry.center();
            const conditionMesh = new THREE.Mesh(conditionGeometry, material);
            conditionMesh.position.set(0, -18, 0);
            conditionMesh.castShadow = true;
            mainGroup.add(conditionMesh);
        }

        function createCloud(material) {
            const group = new THREE.Group();
            
            const positions = [
                { x: 0, y: 0, z: 0, r: 5 },
                { x: -4.5, y: 0, z: -1, r: 4 },
                { x: 4.5, y: 0, z: -1, r: 4 },
                { x: -2, y: 3, z: 0, r: 3.5 },
                { x: 2, y: 3, z: 0, r: 3.5 },
                { x: -6, y: -1, z: 1, r: 2 },
                { x: 6, y: -1, z: 1, r: 2 }
            ];
            
            positions.forEach(pos => {
                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(pos.r, 32, 32),
                    material
                );
                sphere.position.set(pos.x, pos.y, pos.z);
                sphere.castShadow = true;
                group.add(sphere);
            });
            
            return group;
        }

        function buildDailyForecast() {
            const container = document.getElementById('daily-forecast');
            container.innerHTML = '';
            
            const data = forecastData.daily;
            if (!data || !data.length) return;
            
            // Show first 8 days
            data.slice(0, 8).forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'daily-item';
                
                const date = new Date(item.dt * 1000);
                const dayLabel = i === 0 ? 'TODAY' : date.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
                
                const high = item.temp && item.temp.max ? Math.round(item.temp.max) : 0;
                const low = item.temp && item.temp.min ? Math.round(item.temp.min) : 0;
                const icon = item.weather && item.weather[0] ? item.weather[0].icon : '01d';
                
                el.innerHTML = `
                    <div class="daily-day">${dayLabel}</div>
                    <div class="daily-icon">
                        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt=""/>
                    </div>
                    <div class="daily-high">${high}°</div>
                    <div class="daily-low">${low}°</div>
                `;
                
                container.appendChild(el);
            });
        }

        function buildHourlyForecast() {
            const tempsContainer = document.getElementById('slider-temps');
            const timesContainer = document.getElementById('hourly-times');
            
            tempsContainer.innerHTML = '';
            timesContainer.innerHTML = '';
            
            const data = forecastData.hourly;
            if (!data || !data.length) return;
            
            // Build temperature values inside slider
            data.forEach((item, i) => {
                const temp = item.temp ? Math.round(item.temp) : 0;
                const tempEl = document.createElement('div');
                tempEl.className = `slider-temp ${i === 0 ? 'active' : ''}`;
                tempEl.textContent = `${temp}°`;
                tempEl.dataset.index = i;
                tempsContainer.appendChild(tempEl);
            });
            
            // Build time labels - show every 3 hours
            const timeIndices = [0, 3, 6, 9, 12, 15, 18, 21];
            timeIndices.forEach(i => {
                if (i < data.length) {
                    const item = data[i];
                    const date = new Date(item.dt * 1000);
                    const timeEl = document.createElement('div');
                    timeEl.className = `hourly-time ${i === 0 ? 'active' : ''}`;
                    timeEl.textContent = i === 0 ? 'NOW' : date.getHours();
                    timeEl.dataset.index = i;
                    timesContainer.appendChild(timeEl);
                }
            });
            
            setupHourlySlider();
        }

        function setupHourlySlider() {
            const slider = document.getElementById('hourly-slider');
            const tempsContainer = document.getElementById('slider-temps');
            const data = forecastData.hourly;
            
            if (!data || !data.length) return;
            
            let currentIndex = 0;
            let isDragging = false;
            let startX = 0;
            let currentTranslate = 0;
            let prevTranslate = 0;
            
            const itemWidth = 100; // width of each temperature item
            const sliderWidth = slider.offsetWidth;
            const centerOffset = sliderWidth / 2 - itemWidth / 2;
            
            function updateSlider(index) {
                currentIndex = Math.max(0, Math.min(data.length - 1, Math.round(index)));
                const translate = centerOffset - (currentIndex * itemWidth);
                tempsContainer.style.transform = `translateX(${translate}px)`;
                
                // Update active states
                const tempEls = tempsContainer.querySelectorAll('.slider-temp');
                tempEls.forEach((el, i) => {
                    el.classList.toggle('active', i === currentIndex);
                });
                
                // Update 3D scene
                const item = data[currentIndex];
                if (item) {
                    const temp = item.temp ? Math.round(item.temp) : 0;
                    const condition = item.weather && item.weather[0] ? item.weather[0].main : 'Clear';
                    drawWeather(condition, temp);
                    document.getElementById('condition-label').textContent = condition;
                }
            }
            
            function handleStart(clientX) {
                isDragging = true;
                startX = clientX;
                prevTranslate = currentTranslate;
                slider.style.cursor = 'grabbing';
                playTap();
            }
            
            function handleMove(clientX) {
                if (!isDragging) return;
                
                const deltaX = clientX - startX;
                currentTranslate = prevTranslate + deltaX;
                
                // Calculate which index we're at
                const indexFloat = -(currentTranslate - centerOffset) / itemWidth;
                updateSlider(indexFloat);
            }
            
            function handleEnd() {
                isDragging = false;
                slider.style.cursor = 'grab';
                
                // Snap to nearest
                prevTranslate = centerOffset - (currentIndex * itemWidth);
                currentTranslate = prevTranslate;
            }
            
            // Mouse events
            slider.addEventListener('mousedown', e => {
                e.preventDefault();
                handleStart(e.clientX);
            });
            
            window.addEventListener('mousemove', e => handleMove(e.clientX));
            window.addEventListener('mouseup', handleEnd);
            
            // Touch events
            slider.addEventListener('touchstart', e => {
                handleStart(e.touches[0].clientX);
            }, { passive: true });
            
            slider.addEventListener('touchmove', e => {
                handleMove(e.touches[0].clientX);
            }, { passive: true });
            
            slider.addEventListener('touchend', handleEnd, { passive: true });
            
            // Initialize at first position
            updateSlider(0);
        }

        function switchToDaily() {
            currentMode = 'daily';
            document.getElementById('daily-forecast').classList.add('active');
            document.getElementById('hourly-forecast').classList.remove('active');
            
            if (forecastData.daily && forecastData.daily.length > 0) {
                const first = forecastData.daily[0];
                const temp = first.temp && first.temp.day ? Math.round(first.temp.day) : 0;
                const condition = first.weather && first.weather[0] ? first.weather[0].main : 'Clear';
                drawWeather(condition, temp);
                document.getElementById('condition-label').textContent = condition;
            }
        }

        function switchToHourly() {
            currentMode = 'hourly';
            document.getElementById('daily-forecast').classList.remove('active');
            document.getElementById('hourly-forecast').classList.add('active');
            
            if (forecastData.hourly && forecastData.hourly.length > 0) {
                const first = forecastData.hourly[0];
                const temp = first.temp ? Math.round(first.temp) : 0;
                const condition = first.weather && first.weather[0] ? first.weather[0].main : 'Clear';
                drawWeather(condition, temp);
                document.getElementById('condition-label').textContent = condition;
            }
        }

        // Vertical swipe to toggle modes
        let swipeStartY = 0;
        let swipeStartX = 0;
        const container = document.getElementById('forecast-container');
        
        container.addEventListener('touchstart', (e) => {
            swipeStartY = e.touches[0].clientY;
            swipeStartX = e.touches[0].clientX;
        }, { passive: true });
        
        container.addEventListener('touchend', (e) => {
            const deltaY = e.changedTouches[0].clientY - swipeStartY;
            const deltaX = Math.abs(e.changedTouches[0].clientX - swipeStartX);
            
            if (Math.abs(deltaY) > 50 && deltaX < 40) {
                playSwipe();
                if (deltaY < 0) {
                    // Swipe up - hourly
                    switchToHourly();
                } else {
                    // Swipe down - daily
                    switchToDaily();
                }
            }
        }, { passive: true });

        function animate() {
            requestAnimationFrame(animate);
            
            if (!isDragging && Date.now() - lastInteraction > 2000) {
                mainGroup.rotation.y += 0.001;
            }
            
            renderer.render(scene, camera);
        }

        function setup3DInteraction() {
            let prev = { x: 0, y: 0 };
            const canvas = document.getElementById('canvas-container');
            
            // Mouse drag
            canvas.addEventListener('mousedown', e => {
                isDragging = true;
                prev = { x: e.clientX, y: e.clientY };
            });
            
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                mainGroup.rotation.y += (e.clientX - prev.x) * 0.01;
                mainGroup.rotation.x += (e.clientY - prev.y) * 0.01;
                mainGroup.rotation.x = Math.max(-Math.PI/4, Math.min(Math.PI/4, mainGroup.rotation.x));
                prev = { x: e.clientX, y: e.clientY };
                lastInteraction = Date.now();
            });
            
            window.addEventListener('mouseup', () => isDragging = false);
            
            // Touch drag
            let touchStartPos = { x: 0, y: 0 };
            canvas.addEventListener('touchstart', e => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    prev = touchStartPos;
                }
            });
            
            canvas.addEventListener('touchmove', e => {
                if (e.touches.length === 1 && isDragging) {
                    const touch = e.touches[0];
                    mainGroup.rotation.y += (touch.clientX - prev.x) * 0.01;
                    mainGroup.rotation.x += (touch.clientY - prev.y) * 0.01;
                    mainGroup.rotation.x = Math.max(-Math.PI/4, Math.min(Math.PI/4, mainGroup.rotation.x));
                    prev = { x: touch.clientX, y: touch.clientY };
                    lastInteraction = Date.now();
                }
            });
            
            canvas.addEventListener('touchend', () => isDragging = false);
            
            // Pinch zoom
            let lastDistance = 0;
            canvas.addEventListener('touchstart', e => {
                if (e.touches.length === 2) {
                    isDragging = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    lastDistance = Math.sqrt(dx * dx + dy * dy);
                }
            });
            
            canvas.addEventListener('touchmove', e => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (lastDistance > 0) {
                        const delta = distance - lastDistance;
                        currentZoom *= (1 + delta * 0.005);
                        currentZoom = Math.max(0.5, Math.min(2.5, currentZoom));
                        mainGroup.scale.set(currentZoom, currentZoom, currentZoom);
                        lastInteraction = Date.now();
                    }
                    
                    lastDistance = distance;
                }
            }, { passive: false });
            
            canvas.addEventListener('touchend', () => {
                lastDistance = 0;
            });
            
            // Mouse wheel zoom
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -1 : 1;
                currentZoom += delta * 0.05;
                currentZoom = Math.max(0.5, Math.min(2.5, currentZoom));
                mainGroup.scale.set(currentZoom, currentZoom, currentZoom);
                lastInteraction = Date.now();
            }, { passive: false });
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        init();
    </script>
</body>
</html>
