<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Boring Weather</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1f;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            color: #ffffff;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        
        .top-bar {
            padding: 60px 30px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .city {
            letter-spacing: 6px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0.5;
            text-transform: uppercase;
        }

        /* Forecast area */
        .forecast-area {
            margin-top: auto;
            padding: 0 20px 40px 20px;
            pointer-events: auto;
        }
        
        .condition-label {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }
        
        /* DAILY FORECAST */
        .daily-view {
            display: none;
        }
        
        .daily-view.active {
            display: block;
        }
        
        .daily-row {
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }
        
        .daily-day {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .day-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }
        
        .day-icon {
            width: 32px;
            height: 32px;
        }
        
        .day-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .day-high {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        
        .day-low {
            font-size: 13px;
            opacity: 0.5;
            margin-top: -4px;
        }
        
        /* HOURLY FORECAST */
        .hourly-view {
            display: none;
        }
        
        .hourly-view.active {
            display: block;
        }
        
        /* The big pill slider */
        .pill-slider {
            position: relative;
            height: 70px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 35px;
            overflow: hidden;
            margin-bottom: 10px;
            cursor: grab;
            touch-action: pan-x;
        }
        
        .pill-slider:active {
            cursor: grabbing;
        }
        
        /* Container for all temps that moves */
        .temps-track {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            align-items: center;
            transition: transform 0.1s ease-out;
            will-change: transform;
        }
        
        .temp-item {
            width: 90px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 28px;
            font-weight: 700;
            color: #000000;
            letter-spacing: -1px;
            transition: font-size 0.2s ease, opacity 0.2s ease;
            opacity: 0.5;
        }
        
        .temp-item.center {
            font-size: 34px;
            opacity: 1;
        }
        
        /* Time labels under slider */
        .time-labels {
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
        }
        
        .time-label {
            font-size: 11px;
            font-weight: 500;
            opacity: 0.4;
            letter-spacing: 0.3px;
        }
        
        .time-label.active {
            opacity: 1;
            font-weight: 700;
        }
        
        /* Swipe hint */
        .swipe-hint {
            text-align: center;
            font-size: 9px;
            opacity: 0.25;
            margin-top: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="top-bar">
            <div class="city" id="city-name">GRÖDINGE</div>
        </div>

        <div class="forecast-area" id="forecast-area">
            <div class="condition-label" id="condition-label">Cloudy</div>
            
            <!-- DAILY VIEW -->
            <div class="daily-view active" id="daily-view">
                <div class="daily-row" id="daily-row"></div>
            </div>
            
            <!-- HOURLY VIEW -->
            <div class="hourly-view" id="hourly-view">
                <div class="pill-slider" id="pill-slider">
                    <div class="temps-track" id="temps-track"></div>
                </div>
                <div class="time-labels" id="time-labels"></div>
            </div>
            
            <div class="swipe-hint">↕ swipe to toggle</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
    <script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>

    <script>
        const API_KEY = 'dd6a890cc06c02cacd3ad1ec55e98bc6';
        let scene, camera, renderer, mainGroup;
        let isDragging = false, lastInteraction = Date.now();
        let currentZoom = 1;
        let weatherData = {
            hourly: [],
            daily: []
        };
        let currentView = 'daily';
        let myFont = null;

        // Audio
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        function playTap() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }
        
        function playSwipe() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }

        // 3D Material
        function createMaterial() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#3a3a40';
            ctx.fillRect(0, 0, 512, 512);
            
            const imageData = ctx.getImageData(0, 0, 512, 512);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 35;
                data[i] = Math.max(0, Math.min(255, 58 + noise));
                data[i + 1] = Math.max(0, Math.min(255, 58 + noise));
                data[i + 2] = Math.max(0, Math.min(255, 64 + noise));
                data[i + 3] = 255;
            }
            ctx.putImageData(imageData, 0, 0);
            
            const texture = new THREE.CanvasTexture(canvas);
            return new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.95,
                metalness: 0.05,
                bumpMap: texture,
                bumpScale: 0.4,
                color: 0x3a3a40
            });
        }

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 0, 65);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(10, 20, 15);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
            fillLight.position.set(-15, -10, 10);
            scene.add(fillLight);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            setup3DControls();
            
            new THREE.FontLoader().load(
                'https://threejs.org/examples/fonts/helvetiker_bold.typeface.json',
                font => {
                    myFont = font;
                    fetchWeather();
                    animate3D();
                }
            );
        }

        async function fetchWeather() {
            try {
                navigator.geolocation.getCurrentPosition(
                    pos => loadWeather(pos.coords.latitude, pos.coords.longitude),
                    () => loadWeather(59.1936, 17.3654)
                );
            } catch (e) {
                loadWeather(59.1936, 17.3654);
            }
        }

        async function loadWeather(lat, lon) {
            try {
                const current = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
                ).then(r => r.json());
                
                const forecast = await fetch(
                    `https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&exclude=minutely,alerts`
                ).then(r => r.json());

                if (current && current.main) {
                    document.getElementById('city-name').textContent = current.name.toUpperCase();
                    
                    const temp = Math.round(current.main.temp);
                    const condition = current.weather[0].main;
                    
                    if (forecast) {
                        weatherData.hourly = forecast.hourly ? forecast.hourly.slice(0, 24) : [];
                        weatherData.daily = forecast.daily ? forecast.daily.slice(0, 8) : [];
                    }
                    
                    buildDailyView();
                    buildHourlyView();
                    draw3DWeather(condition, temp);
                    document.getElementById('condition-label').textContent = condition;
                }
            } catch (e) {
                console.error('Weather error:', e);
                // Fallback data
                weatherData.hourly = Array.from({length: 24}, (_, i) => ({
                    dt: Date.now()/1000 + i*3600,
                    temp: -2 + Math.random() * 3,
                    weather: [{icon: '04n', main: 'Clouds'}]
                }));
                weatherData.daily = Array.from({length: 8}, (_, i) => ({
                    dt: Date.now()/1000 + i*86400,
                    temp: {day: -2, min: -13, max: -2},
                    weather: [{icon: '04n', main: 'Clouds'}]
                }));
                buildDailyView();
                buildHourlyView();
                draw3DWeather('Clouds', -2);
            }
        }

        function buildDailyView() {
            const container = document.getElementById('daily-row');
            container.innerHTML = '';
            
            if (!weatherData.daily.length) return;
            
            weatherData.daily.forEach((day, i) => {
                const date = new Date(day.dt * 1000);
                const dayName = i === 0 ? 'TODAY' : 
                    date.toLocaleDateString('en-US', {weekday: 'short'}).toUpperCase();
                
                const high = day.temp.max ? Math.round(day.temp.max) : Math.round(day.temp.day);
                const low = day.temp.min ? Math.round(day.temp.min) : Math.round(day.temp.day) - 11;
                const icon = day.weather[0].icon;
                
                const dayEl = document.createElement('div');
                dayEl.className = 'daily-day';
                dayEl.innerHTML = `
                    <div class="day-label">${dayName}</div>
                    <div class="day-icon">
                        <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt=""/>
                    </div>
                    <div class="day-high">${high}°</div>
                    <div class="day-low">${low}°</div>
                `;
                container.appendChild(dayEl);
            });
        }

        function buildHourlyView() {
            const track = document.getElementById('temps-track');
            const labels = document.getElementById('time-labels');
            
            track.innerHTML = '';
            labels.innerHTML = '';
            
            if (!weatherData.hourly.length) return;
            
            // Build temperature items
            weatherData.hourly.forEach((hour, i) => {
                const temp = Math.round(hour.temp);
                const tempEl = document.createElement('div');
                tempEl.className = 'temp-item';
                tempEl.textContent = `${temp}°`;
                tempEl.dataset.index = i;
                track.appendChild(tempEl);
            });
            
            // Build time labels (every 3 hours)
            [0, 3, 6, 9, 12, 15, 18, 21].forEach(i => {
                if (i < weatherData.hourly.length) {
                    const date = new Date(weatherData.hourly[i].dt * 1000);
                    const labelEl = document.createElement('div');
                    labelEl.className = 'time-label';
                    labelEl.textContent = i === 0 ? 'NOW' : date.getHours();
                    labelEl.dataset.index = i;
                    labels.appendChild(labelEl);
                }
            });
            
            setupSlider();
        }

        function setupSlider() {
            const slider = document.getElementById('pill-slider');
            const track = document.getElementById('temps-track');
            
            if (!weatherData.hourly.length) return;
            
            const itemWidth = 90;
            const sliderWidth = slider.offsetWidth;
            const centerOffset = sliderWidth / 2 - itemWidth / 2;
            
            let currentIndex = 0;
            let isDraggingSlider = false;
            let startX = 0;
            let currentTranslate = 0;
            let prevTranslate = 0;
            
            function updateSlider(index) {
                currentIndex = Math.max(0, Math.min(weatherData.hourly.length - 1, Math.round(index)));
                const translate = centerOffset - (currentIndex * itemWidth);
                track.style.transform = `translateX(${translate}px)`;
                
                // Update center class
                const items = track.querySelectorAll('.temp-item');
                items.forEach((item, i) => {
                    item.classList.toggle('center', i === currentIndex);
                });
                
                // Update 3D
                const hour = weatherData.hourly[currentIndex];
                if (hour) {
                    const temp = Math.round(hour.temp);
                    const condition = hour.weather[0].main;
                    draw3DWeather(condition, temp);
                    document.getElementById('condition-label').textContent = condition;
                }
            }
            
            function handleStart(x) {
                isDraggingSlider = true;
                startX = x;
                prevTranslate = currentTranslate;
                slider.style.cursor = 'grabbing';
                playTap();
            }
            
            function handleMove(x) {
                if (!isDraggingSlider) return;
                
                const deltaX = x - startX;
                currentTranslate = prevTranslate + deltaX;
                const indexFloat = -(currentTranslate - centerOffset) / itemWidth;
                updateSlider(indexFloat);
            }
            
            function handleEnd() {
                isDraggingSlider = false;
                slider.style.cursor = 'grab';
                prevTranslate = centerOffset - (currentIndex * itemWidth);
                currentTranslate = prevTranslate;
            }
            
            slider.addEventListener('mousedown', e => {
                e.preventDefault();
                handleStart(e.clientX);
            });
            
            window.addEventListener('mousemove', e => handleMove(e.clientX));
            window.addEventListener('mouseup', handleEnd);
            
            slider.addEventListener('touchstart', e => {
                handleStart(e.touches[0].clientX);
            });
            
            slider.addEventListener('touchmove', e => {
                handleMove(e.touches[0].clientX);
            });
            
            slider.addEventListener('touchend', handleEnd);
            
            updateSlider(0);
        }

        function draw3DWeather(condition, temp) {
            while(mainGroup.children.length > 0) {
                mainGroup.remove(mainGroup.children[0]);
            }
            
            if (!myFont) return;
            
            const material = createMaterial();
            
            // Cloud
            const cloud = new THREE.Group();
            const positions = [
                {x:0, y:0, z:0, r:5}, {x:-4.5, y:0, z:-1, r:4}, {x:4.5, y:0, z:-1, r:4},
                {x:-2, y:3, z:0, r:3.5}, {x:2, y:3, z:0, r:3.5},
                {x:-6, y:-1, z:1, r:2}, {x:6, y:-1, z:1, r:2}
            ];
            positions.forEach(pos => {
                const sphere = new THREE.Mesh(new THREE.SphereGeometry(pos.r, 32, 32), material);
                sphere.position.set(pos.x, pos.y, pos.z);
                sphere.castShadow = true;
                cloud.add(sphere);
            });
            cloud.position.set(0, 5, 0);
            mainGroup.add(cloud);
            
            // Temperature
            const tempGeo = new THREE.TextGeometry(temp.toString(), {
                font: myFont, size: 14, height: 3, curveSegments: 12,
                bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.2, bevelSegments: 5
            });
            tempGeo.center();
            const tempMesh = new THREE.Mesh(tempGeo, material);
            tempMesh.position.set(0, -8, 0);
            tempMesh.castShadow = true;
            mainGroup.add(tempMesh);
            
            // Degree symbol
            const degGeo = new THREE.TextGeometry('°', {
                font: myFont, size: 6, height: 2, curveSegments: 12,
                bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.1, bevelSegments: 5
            });
            const degMesh = new THREE.Mesh(degGeo, material);
            degMesh.position.set(10, -5, 0);
            degMesh.castShadow = true;
            mainGroup.add(degMesh);
            
            // Condition
            const condGeo = new THREE.TextGeometry(condition.toUpperCase(), {
                font: myFont, size: 4, height: 1.5, curveSegments: 8,
                bevelEnabled: true, bevelThickness: 0.15, bevelSize: 0.1, bevelSegments: 3
            });
            condGeo.center();
            const condMesh = new THREE.Mesh(condGeo, material);
            condMesh.position.set(0, -18, 0);
            condMesh.castShadow = true;
            mainGroup.add(condMesh);
        }

        function switchView(newView) {
            if (currentView === newView) return;
            currentView = newView;
            
            if (newView === 'daily') {
                document.getElementById('daily-view').classList.add('active');
                document.getElementById('hourly-view').classList.remove('active');
                
                if (weatherData.daily[0]) {
                    const day = weatherData.daily[0];
                    const temp = Math.round(day.temp.day);
                    const condition = day.weather[0].main;
                    draw3DWeather(condition, temp);
                    document.getElementById('condition-label').textContent = condition;
                }
            } else {
                document.getElementById('daily-view').classList.remove('active');
                document.getElementById('hourly-view').classList.add('active');
                
                if (weatherData.hourly[0]) {
                    const hour = weatherData.hourly[0];
                    const temp = Math.round(hour.temp);
                    const condition = hour.weather[0].main;
                    draw3DWeather(condition, temp);
                    document.getElementById('condition-label').textContent = condition;
                }
            }
        }

        // Swipe handling
        let swipeStartY = 0;
        let swipeStartX = 0;
        const forecastArea = document.getElementById('forecast-area');
        
        forecastArea.addEventListener('touchstart', e => {
            swipeStartY = e.touches[0].clientY;
            swipeStartX = e.touches[0].clientX;
        });
        
        forecastArea.addEventListener('touchend', e => {
            const deltaY = e.changedTouches[0].clientY - swipeStartY;
            const deltaX = Math.abs(e.changedTouches[0].clientX - swipeStartX);
            
            if (Math.abs(deltaY) > 50 && deltaX < 40) {
                playSwipe();
                switchView(deltaY < 0 ? 'hourly' : 'daily');
            }
        });

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (!isDragging && Date.now() - lastInteraction > 2000) {
                mainGroup.rotation.y += 0.001;
            }
            renderer.render(scene, camera);
        }

        function setup3DControls() {
            let prev = {x: 0, y: 0};
            const canvas = document.getElementById('canvas-container');
            
            canvas.addEventListener('mousedown', e => {
                isDragging = true;
                prev = {x: e.clientX, y: e.clientY};
            });
            
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                mainGroup.rotation.y += (e.clientX - prev.x) * 0.01;
                mainGroup.rotation.x += (e.clientY - prev.y) * 0.01;
                mainGroup.rotation.x = Math.max(-Math.PI/4, Math.min(Math.PI/4, mainGroup.rotation.x));
                prev = {x: e.clientX, y: e.clientY};
                lastInteraction = Date.now();
            });
            
            window.addEventListener('mouseup', () => isDragging = false);
            
            canvas.addEventListener('touchstart', e => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    prev = {x: e.touches[0].clientX, y: e.touches[0].clientY};
                }
            });
            
            canvas.addEventListener('touchmove', e => {
                if (e.touches.length === 1 && isDragging) {
                    const touch = e.touches[0];
                    mainGroup.rotation.y += (touch.clientX - prev.x) * 0.01;
                    mainGroup.rotation.x += (touch.clientY - prev.y) * 0.01;
                    mainGroup.rotation.x = Math.max(-Math.PI/4, Math.min(Math.PI/4, mainGroup.rotation.x));
                    prev = {x: touch.clientX, y: touch.clientY};
                    lastInteraction = Date.now();
                }
            });
            
            canvas.addEventListener('touchend', () => isDragging = false);
            
            // Pinch zoom
            let lastDistance = 0;
            canvas.addEventListener('touchmove', e => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (lastDistance > 0) {
                        const delta = distance - lastDistance;
                        currentZoom *= (1 + delta * 0.005);
                        currentZoom = Math.max(0.5, Math.min(2.5, currentZoom));
                        mainGroup.scale.set(currentZoom, currentZoom, currentZoom);
                        lastInteraction = Date.now();
                    }
                    lastDistance = distance;
                }
            }, {passive: false});
            
            canvas.addEventListener('touchend', () => {
                lastDistance = 0;
            });
            
            // Mouse wheel
            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -1 : 1;
                currentZoom += delta * 0.05;
                currentZoom = Math.max(0.5, Math.min(2.5, currentZoom));
                mainGroup.scale.set(currentZoom, currentZoom, currentZoom);
                lastInteraction = Date.now();
            }, {passive: false});
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        init3D();
    </script>
</body>
</html>
