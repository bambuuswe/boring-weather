<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Boring Weather</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: #1a1a1f;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            color: #fff;
            overflow: hidden;
            position: fixed;
            width: 100%; height: 100%;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        #canvas-3d {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #ui {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            padding: 58px 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .city {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 6px;
            opacity: 0.55;
            text-transform: uppercase;
        }

        .condition-label {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-top: auto;
            margin-bottom: 16px;
            padding: 0 20px;
        }

        /* The forecast canvas */
        #forecast-canvas {
            display: block;
            touch-action: none;
            pointer-events: auto;
            cursor: grab;
        }

        #forecast-canvas:active { cursor: grabbing; }

        /* Zoom level label */
        .zoom-label {
            text-align: center;
            font-size: 9px;
            letter-spacing: 2px;
            opacity: 0.3;
            margin-top: 8px;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div id="ui">
    <div class="top-bar">
        <div class="city" id="city-name">GRÖDINGE</div>
    </div>
    <div class="condition-label" id="condition-label">Cloudy</div>
    <canvas id="forecast-canvas"></canvas>
    <div class="zoom-label" id="zoom-label">DAILY · DRAG ↕ TO ZOOM</div>
</div>

<canvas id="canvas-3d"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
<script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const API_KEY = 'dd6a890cc06c02cacd3ad1ec55e98bc6';
const FORECAST_H = 150; // height of forecast canvas

// ─── STATE ───────────────────────────────────────────────────────────────────
let weatherData = { hourly: [], daily: [] };
let zoom = 0;          // 0 = fully daily, 1 = fully hourly
let offsetX = 0;       // horizontal pan (px)
let iconCache = {};    // preloaded images
let myFont = null;
let conditionStr = 'Cloudy';
let tempVal = 0;

// ─── AUDIO ───────────────────────────────────────────────────────────────────
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, vol = 0.1) {
    try {
        initAudio();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
}

// ─── FORECAST CANVAS ─────────────────────────────────────────────────────────
const fc = document.getElementById('forecast-canvas');
const ctx = fc.getContext('2d');

function resizeCanvas() {
    fc.width = window.innerWidth;
    fc.height = FORECAST_H;
    drawForecast();
}

// Preload icon image, return cached promise
function loadIcon(iconCode) {
    if (iconCache[iconCode]) return iconCache[iconCode];
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const p = new Promise(res => { img.onload = () => res(img); img.onerror = () => res(null); });
    img.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    iconCache[iconCode] = p;
    return p;
}

// Preload all icons in dataset
async function preloadIcons(data) {
    const codes = [...new Set(data.map(d => d.weather?.[0]?.icon).filter(Boolean))];
    await Promise.all(codes.map(loadIcon));
}

function getColumnData() {
    // Interpolate between daily and hourly based on zoom
    if (zoom <= 0.5) return weatherData.daily;
    return weatherData.hourly;
}

function getTemp(d) {
    if (typeof d.temp === 'number') return d.temp;
    return d.temp?.day ?? 0;
}

function getColWidth() {
    // At zoom=0: wide columns (daily, show 8 columns), at zoom=1: narrow (hourly, show 8 hours)
    const W = fc.width;
    const dailyW = W / 8;
    const hourlyW = W / 6;
    return dailyW + (hourlyW - dailyW) * zoom;
}

function getLabel(d, i) {
    const date = new Date(d.dt * 1000);
    if (zoom > 0.5) {
        return i === 0 ? 'NOW' : String(date.getHours()).padStart(2, '0');
    } else {
        return i === 0 ? 'TODAY' : date.toLocaleDateString('en-US', {weekday:'short'}).toUpperCase();
    }
}

function drawForecast() {
    const W = fc.width;
    const H = fc.height;
    ctx.clearRect(0, 0, W, H);

    const data = getColumnData();
    if (!data || !data.length) return;

    const colW = getColWidth();
    const PAD = 20;

    // Pill background
    const pillX = PAD;
    const pillY = 10;
    const pillW = W - PAD * 2;
    const pillH = H - 44;
    const pillR = pillH / 2;

    ctx.beginPath();
    ctx.roundRect(pillX, pillY, pillW, pillH, pillR);
    ctx.fillStyle = zoom > 0.5 ? 'rgba(220,220,220,0.92)' : 'rgba(255,255,255,0.08)';
    ctx.fill();

    // Clipping to pill
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(pillX, pillY, pillW, pillH, pillR);
    ctx.clip();

    // Temps range
    const temps = data.map(getTemp);
    const minT = Math.min(...temps);
    const maxT = Math.max(...temps);
    const tRange = Math.max(maxT - minT, 2);

    const curveTop = pillY + 28;
    const curveBot = pillY + pillH - 36;
    const curveH = curveBot - curveTop;

    // Temperature curve
    ctx.beginPath();
    let first = true;
    data.forEach((d, i) => {
        const x = W / 2 + offsetX + i * colW;
        const t = getTemp(d);
        const y = curveBot - ((t - minT) / tRange) * curveH;
        if (first) { ctx.moveTo(x, y); first = false; }
        else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = zoom > 0.5 ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.stroke();

    // Each column: icon + temp
    data.forEach(async (d, i) => {
        const x = W / 2 + offsetX + i * colW;
        if (x < pillX - colW || x > pillX + pillW + colW) return;

        const t = Math.round(getTemp(d));
        const y = curveBot - ((getTemp(d) - minT) / tRange) * curveH;

        // Dot on curve
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = zoom > 0.5 ? 'rgba(0,0,0,0.5)' : 'rgba(255,255,255,0.5)';
        ctx.fill();

        // Temperature label
        const isDarkPill = zoom > 0.5;
        ctx.fillStyle = isDarkPill ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.9)';
        ctx.font = `bold ${zoom > 0.5 ? 28 : 18}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${t}°`, x, curveBot + 18);

        // Icon (draw if cached)
        const iconCode = d.weather?.[0]?.icon;
        if (iconCode) {
            const cached = iconCache[iconCode];
            if (cached && cached.then === undefined) {
                // Already resolved - it's an img element? No, we stored promises.
            }
        }
    });

    ctx.restore();

    // Time labels BELOW pill
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const labelY = pillY + pillH + 8;

    data.forEach((d, i) => {
        const x = W / 2 + offsetX + i * colW;
        if (x < PAD - colW || x > W - PAD + colW) return;

        const label = getLabel(d, i);
        
        // Highlight the center-most label
        const distFromCenter = Math.abs(x - W / 2);
        const opacity = Math.max(0.25, 1 - distFromCenter / (W * 0.4));

        ctx.fillStyle = `rgba(255,255,255,${opacity})`;
        ctx.font = `${distFromCenter < colW/2 ? 'bold' : '500'} 11px -apple-system, sans-serif`;
        ctx.fillText(label, x, labelY);
    });

    // Draw icons after async loads
    drawIcons(data);
}

async function drawIcons(data) {
    const W = fc.width;
    const colW = getColWidth();
    const H = fc.height;
    const pillY = 10;
    const pillH = H - 44;
    const temps = data.map(getTemp);
    const minT = Math.min(...temps);
    const maxT = Math.max(...temps);
    const tRange = Math.max(maxT - minT, 2);
    const curveBot = pillY + pillH - 36;
    const curveH = curveBot - (pillY + 28);

    const PAD = 20;

    ctx.save();
    ctx.beginPath();
    ctx.roundRect(PAD, pillY, W - PAD*2, pillH, pillH/2);
    ctx.clip();

    for (let i = 0; i < data.length; i++) {
        const d = data[i];
        const x = W / 2 + offsetX + i * colW;
        if (x < PAD - colW || x > W - PAD + colW) continue;

        const iconCode = d.weather?.[0]?.icon;
        if (!iconCode) continue;

        const img = await loadIcon(iconCode);
        if (!img) continue;

        const t = getTemp(d);
        const curveY = curveBot - ((t - minT) / tRange) * curveH;
        const iconSize = zoom > 0.5 ? 36 : 28;

        ctx.drawImage(img, x - iconSize/2, curveY - iconSize - 8, iconSize, iconSize);
    }

    ctx.restore();

    // Redraw temp labels on top of icons
    data.forEach((d, i) => {
        const x = W / 2 + offsetX + i * colW;
        if (x < PAD - colW || x > W - PAD + colW) return;

        const temps2 = data.map(getTemp);
        const minT2 = Math.min(...temps2);
        const maxT2 = Math.max(...temps2);
        const tRange2 = Math.max(maxT2 - minT2, 2);
        const curveBot2 = (10 + (FORECAST_H-44) - 36);
        const t = Math.round(getTemp(d));

        const isDark = zoom > 0.5;
        ctx.fillStyle = isDark ? 'rgba(0,0,0,0.9)' : 'rgba(255,255,255,0.9)';
        ctx.font = `bold ${isDark ? 28 : 18}px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${t}°`, x, curveBot2 + 18);
    });
}

// Update 3D based on center column
function updateCenter() {
    const data = getColumnData();
    if (!data.length) return;

    const W = fc.width;
    const colW = getColWidth();
    // Find which index is closest to center
    let closest = 0;
    let minDist = Infinity;
    data.forEach((d, i) => {
        const x = W / 2 + offsetX + i * colW;
        const dist = Math.abs(x - W / 2);
        if (dist < minDist) { minDist = dist; closest = i; }
    });

    const d = data[closest];
    const temp = Math.round(getTemp(d));
    const condition = d.weather?.[0]?.main ?? 'Clear';

    if (condition !== conditionStr || temp !== tempVal) {
        conditionStr = condition;
        tempVal = temp;
        document.getElementById('condition-label').textContent = condition;
        draw3DWeather(condition, temp);
    }

    // Zoom label
    const label = zoom < 0.3 ? 'DAILY · DRAG ↕ TO ZOOM' : zoom > 0.7 ? 'HOURLY · DRAG ↕ TO ZOOM' : 'ZOOMING...';
    document.getElementById('zoom-label').textContent = label;
}

// Clamp offsetX
function clampOffset() {
    const data = getColumnData();
    if (!data.length) return;
    const colW = getColWidth();
    const W = fc.width;
    // Max scroll: last item at center
    const maxOffset = 0;
    const minOffset = -(data.length - 1) * colW;
    offsetX = Math.max(minOffset, Math.min(maxOffset, offsetX));
}

// ─── GESTURES ─────────────────────────────────────────────────────────────────
let gestureActive = false;
let gestureType = null; // 'horizontal' | 'vertical' | null
let gStartX = 0, gStartY = 0;
let gStartOffset = 0, gStartZoom = 0;
let lastBeepIndex = -1;

fc.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
        gestureActive = true;
        gestureType = null;
        gStartX = e.touches[0].clientX;
        gStartY = e.touches[0].clientY;
        gStartOffset = offsetX;
        gStartZoom = zoom;
    }
}, { passive: false });

fc.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!gestureActive || e.touches.length !== 1) return;

    const dx = e.touches[0].clientX - gStartX;
    const dy = e.touches[0].clientY - gStartY;

    if (!gestureType && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
        gestureType = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
    }

    if (gestureType === 'horizontal') {
        offsetX = gStartOffset + dx;
        clampOffset();

        // Beep when crossing column
        const colW = getColWidth();
        const col = Math.round(-offsetX / colW);
        if (col !== lastBeepIndex) {
            lastBeepIndex = col;
            beep(600, 0.05, 0.06);
        }
    } else if (gestureType === 'vertical') {
        // Drag up = zoom in (hourly), drag down = zoom out (daily)
        zoom = Math.max(0, Math.min(1, gStartZoom - dy / 180));

        // Snap offset when switching data set
        if (zoom > 0.5 && gStartZoom <= 0.5) {
            offsetX = 0;
            gStartOffset = 0;
        } else if (zoom <= 0.5 && gStartZoom > 0.5) {
            offsetX = 0;
            gStartOffset = 0;
        }

        beep(400 + zoom * 400, 0.08, 0.06);
    }

    drawForecast();
    updateCenter();
}, { passive: false });

fc.addEventListener('touchend', e => {
    e.preventDefault();
    gestureActive = false;
    gestureType = null;
    // Snap zoom to 0 or 1
    const target = zoom > 0.5 ? 1 : 0;
    animateZoom(target);
}, { passive: false });

// Mouse events for desktop
let mouseDown = false;
fc.addEventListener('mousedown', e => {
    mouseDown = true;
    gestureActive = true;
    gestureType = null;
    gStartX = e.clientX;
    gStartY = e.clientY;
    gStartOffset = offsetX;
    gStartZoom = zoom;
});
window.addEventListener('mousemove', e => {
    if (!mouseDown) return;
    const dx = e.clientX - gStartX;
    const dy = e.clientY - gStartY;
    if (!gestureType && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
        gestureType = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
    }
    if (gestureType === 'horizontal') {
        offsetX = gStartOffset + dx;
        clampOffset();
    } else if (gestureType === 'vertical') {
        zoom = Math.max(0, Math.min(1, gStartZoom - dy / 180));
    }
    drawForecast();
    updateCenter();
});
window.addEventListener('mouseup', () => {
    if (!mouseDown) return;
    mouseDown = false;
    gestureActive = false;
    gestureType = null;
    const target = zoom > 0.5 ? 1 : 0;
    animateZoom(target);
});

// Snap zoom animation
function animateZoom(target) {
    const from = zoom;
    const start = performance.now();
    const dur = 300;
    function step(now) {
        const t = Math.min(1, (now - start) / dur);
        const ease = 1 - Math.pow(1 - t, 3);
        zoom = from + (target - from) * ease;
        clampOffset();
        drawForecast();
        updateCenter();
        if (t < 1) requestAnimationFrame(step);
        else { zoom = target; drawForecast(); updateCenter(); }
    }
    requestAnimationFrame(step);
}

// ─── 3D SCENE ────────────────────────────────────────────────────────────────
let scene, camera, renderer, mainGroup;
let is3DDragging = false, lastInteraction = Date.now();
let currentZoom3D = 1;

function createMaterial() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const cx = c.getContext('2d');
    cx.fillStyle = '#3a3a40';
    cx.fillRect(0, 0, 512, 512);
    const id = cx.getImageData(0, 0, 512, 512);
    const d = id.data;
    for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 35;
        d[i] = d[i+1] = Math.max(0, Math.min(255, 58 + n));
        d[i+2] = Math.max(0, Math.min(255, 64 + n));
        d[i+3] = 255;
    }
    cx.putImageData(id, 0, 0);
    const tex = new THREE.CanvasTexture(c);
    return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0.05, bumpMap: tex, bumpScale: 0.4, color: 0x3a3a40 });
}

function init3D() {
    const c = document.getElementById('canvas-3d');
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
    camera.position.set(0, 0, 65);
    renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const ml = new THREE.DirectionalLight(0xffffff, 1.2);
    ml.position.set(10, 20, 15);
    ml.castShadow = true;
    scene.add(ml);
    const fl = new THREE.DirectionalLight(0x8888ff, 0.4);
    fl.position.set(-15, -10, 10);
    scene.add(fl);
    const rl = new THREE.DirectionalLight(0xffffff, 0.5);
    rl.position.set(-5, 5, -10);
    scene.add(rl);

    mainGroup = new THREE.Group();
    scene.add(mainGroup);

    setup3DControls();

    new THREE.FontLoader().load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', font => {
        myFont = font;
        loadWeatherData();
        animate3D();
    });
}

function draw3DWeather(condition, temp) {
    while (mainGroup.children.length) mainGroup.remove(mainGroup.children[0]);
    if (!myFont) return;

    const mat = createMaterial();
    const cloud = new THREE.Group();

    [{x:0,y:0,z:0,r:5},{x:-4.5,y:0,z:-1,r:4},{x:4.5,y:0,z:-1,r:4},
     {x:-2,y:3,z:0,r:3.5},{x:2,y:3,z:0,r:3.5},{x:-6,y:-1,z:1,r:2},{x:6,y:-1,z:1,r:2}]
    .forEach(p => {
        const s = new THREE.Mesh(new THREE.SphereGeometry(p.r, 32, 32), mat);
        s.position.set(p.x, p.y, p.z);
        s.castShadow = true;
        cloud.add(s);
    });

    cloud.position.set(0, 5, 0);
    mainGroup.add(cloud);

    const tg = new THREE.TextGeometry(temp.toString(), {
        font: myFont, size: 14, height: 3, curveSegments: 12,
        bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.2, bevelSegments: 5
    });
    tg.center();
    const tm = new THREE.Mesh(tg, mat);
    tm.position.set(0, -8, 0);
    tm.castShadow = true;
    mainGroup.add(tm);

    const dg = new THREE.TextGeometry('°', {
        font: myFont, size: 6, height: 2, curveSegments: 12,
        bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.1, bevelSegments: 5
    });
    const dm = new THREE.Mesh(dg, mat);
    dm.position.set(10, -5, 0);
    mainGroup.add(dm);

    const cg = new THREE.TextGeometry(condition.toUpperCase(), {
        font: myFont, size: 4, height: 1.5, curveSegments: 8,
        bevelEnabled: true, bevelThickness: 0.15, bevelSize: 0.1, bevelSegments: 3
    });
    cg.center();
    const cm = new THREE.Mesh(cg, mat);
    cm.position.set(0, -18, 0);
    cm.castShadow = true;
    mainGroup.add(cm);
}

function animate3D() {
    requestAnimationFrame(animate3D);
    if (!is3DDragging && Date.now() - lastInteraction > 2000) {
        mainGroup.rotation.y += 0.0008;
    }
    renderer.render(scene, camera);
}

function setup3DControls() {
    const c = document.getElementById('canvas-3d');
    let prev = {x:0, y:0};
    let lastDist = 0;

    c.addEventListener('mousedown', e => { is3DDragging = true; prev = {x:e.clientX, y:e.clientY}; });
    window.addEventListener('mousemove', e => {
        if (!is3DDragging) return;
        mainGroup.rotation.y += (e.clientX - prev.x) * 0.01;
        mainGroup.rotation.x = Math.max(-Math.PI/4, Math.min(Math.PI/4, mainGroup.rotation.x + (e.clientY - prev.y) * 0.01));
        prev = {x:e.clientX, y:e.clientY};
        lastInteraction = Date.now();
    });
    window.addEventListener('mouseup', () => is3DDragging = false);

    c.addEventListener('touchstart', e => {
        if (e.touches.length === 1) {
            is3DDragging = true;
            prev = {x:e.touches[0].clientX, y:e.touches[0].clientY};
        } else if (e.touches.length === 2) {
            is3DDragging = false;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            lastDist = Math.sqrt(dx*dx + dy*dy);
        }
    });

    c.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && is3DDragging) {
            const t = e.touches[0];
            mainGroup.rotation.y += (t.clientX - prev.x) * 0.01;
            mainGroup.rotation.x = Math.max(-Math.PI/4, Math.min(Math.PI/4, mainGroup.rotation.x + (t.clientY - prev.y) * 0.01));
            prev = {x:t.clientX, y:t.clientY};
            lastInteraction = Date.now();
        } else if (e.touches.length === 2) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (lastDist > 0) {
                currentZoom3D = Math.max(0.5, Math.min(2.5, currentZoom3D * (1 + (dist - lastDist) * 0.005)));
                mainGroup.scale.setScalar(currentZoom3D);
                lastInteraction = Date.now();
            }
            lastDist = dist;
        }
    }, {passive:false});

    c.addEventListener('touchend', e => { is3DDragging = false; lastDist = 0; });

    c.addEventListener('wheel', e => {
        e.preventDefault();
        currentZoom3D = Math.max(0.5, Math.min(2.5, currentZoom3D + (e.deltaY > 0 ? -1 : 1) * 0.05));
        mainGroup.scale.setScalar(currentZoom3D);
        lastInteraction = Date.now();
    }, {passive:false});

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        resizeCanvas();
    });
}

// ─── WEATHER DATA ─────────────────────────────────────────────────────────────
async function loadWeatherData() {
    try {
        await new Promise((res, rej) => {
            navigator.geolocation.getCurrentPosition(res, rej, {timeout:5000});
        }).then(pos => fetchWeather(pos.coords.latitude, pos.coords.longitude))
          .catch(() => fetchWeather(59.1936, 17.3654));
    } catch(e) {
        fetchWeather(59.1936, 17.3654);
    }
}

async function fetchWeather(lat, lon) {
    try {
        const [curr, oneCall] = await Promise.all([
            fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`).then(r=>r.json()),
            fetch(`https://api.openweathermap.org/data/2.5/onecall?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric&exclude=minutely,alerts`).then(r=>r.json())
        ]);

        document.getElementById('city-name').textContent = (curr.name || 'GRÖDINGE').toUpperCase();

        if (oneCall.hourly) weatherData.hourly = oneCall.hourly.slice(0, 24);
        if (oneCall.daily)  weatherData.daily  = oneCall.daily.slice(0, 8);

        // Preload icons
        await preloadIcons([...weatherData.hourly, ...weatherData.daily]);

        const temp = Math.round(curr.main.temp);
        const cond = curr.weather[0].main;
        conditionStr = cond; tempVal = temp;
        document.getElementById('condition-label').textContent = cond;
        draw3DWeather(cond, temp);

        drawForecast();
        updateCenter();

    } catch(e) {
        console.error('API error:', e);
        // Fallback mock data
        const now = Date.now() / 1000;
        weatherData.hourly = Array.from({length:24}, (_,i) => ({
            dt: now + i*3600,
            temp: -2 + Math.sin(i*0.5)*4,
            weather:[{icon:'04n', main:'Clouds'}],
            pop: 0.2
        }));
        weatherData.daily = Array.from({length:8}, (_,i) => ({
            dt: now + i*86400,
            temp:{day:-2+i, min:-13, max:-2+i},
            weather:[{icon:'04n', main:'Clouds'}]
        }));
        draw3DWeather('Clouds', -2);
        drawForecast();
        updateCenter();
    }
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
resizeCanvas();
init3D();
</script>
