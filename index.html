<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Not Boring Weather</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body {
            width:100%; height:100%; overflow:hidden;
            background:#111115;
            font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
            color:#fff; user-select:none; -webkit-font-smoothing:antialiased;
            position:fixed;
        }
        #canvas3d {
            position:absolute; inset:0; z-index:1;
            width:100%; height:100%;
        }
        #overlay {
            position:absolute; inset:0; z-index:2;
            display:flex; flex-direction:column;
            pointer-events:none;
        }
        .city {
            text-align:center;
            padding-top:max(54px, env(safe-area-inset-top, 0px) + 18px);
            font-size:11px; font-weight:700;
            letter-spacing:6px; opacity:.45; text-transform:uppercase;
        }
        #spacer { flex:1; }
        #condition {
            text-align:center; font-size:32px; font-weight:700;
            letter-spacing:-.5px; margin-bottom:14px;
            padding:0 24px; min-height:40px;
        }
        #fc {
            display:block; touch-action:none;
            pointer-events:auto;
        }
        #hint {
            text-align:center; font-size:9px; letter-spacing:2px;
            opacity:.25; text-transform:uppercase; font-weight:600;
            padding: 8px 0 max(26px, env(safe-area-inset-bottom, 0px) + 10px);
        }
    </style>
</head>
<body>
<div id="overlay">
    <div class="city" id="city">GRÖDINGE</div>
    <div id="spacer"></div>
    <div id="condition"></div>
    <canvas id="fc"></canvas>
    <div id="hint">DAILY  ·  DRAG ↕ TO ZOOM</div>
</div>
<canvas id="canvas3d"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
<script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>
<script>
'use strict';

// ─────────────────────────────────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
const KEY = 'dd6a890cc06c02cacd3ad1ec55e98bc6';
const CH  = 170; // forecast canvas height - taller so content fits

// ─────────────────────────────────────────────────────────────────────────────
// DATA STATE
// ─────────────────────────────────────────────────────────────────────────────
let hourly = []; // [{dt, temp, icon, cond}]
let daily  = []; // [{dt, high, low, icon, cond}]
let icons  = {}; // code -> Image (or 'loading')
let zoom   = 0;  // 0=daily, 1=hourly (animated)
let panX   = 0;  // horizontal pan offset

// ─────────────────────────────────────────────────────────────────────────────
// AUDIO
// ─────────────────────────────────────────────────────────────────────────────
let AC;
function beep(f, d, v=.07) {
    try {
        if (!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
        if (AC.state==='suspended') AC.resume();
        const o=AC.createOscillator(), g=AC.createGain();
        o.connect(g); g.connect(AC.destination);
        o.frequency.value=f;
        g.gain.setValueAtTime(v, AC.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+d);
        o.start(); o.stop(AC.currentTime+d);
    } catch(e){}
}

// ─────────────────────────────────────────────────────────────────────────────
// ICON CACHE — key trick: use a separate 'pending' set
// ─────────────────────────────────────────────────────────────────────────────
const pending = new Set();
function getIcon(code) {
    if (!code) return null;
    if (icons[code] instanceof Image) return icons[code];
    if (!pending.has(code)) {
        pending.add(code);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload  = () => { icons[code] = img; pending.delete(code); draw(); };
        img.onerror = () => { icons[code] = null; pending.delete(code); };
        img.src = `https://openweathermap.org/img/wn/${code}@2x.png`;
    }
    return null; // not ready yet
}

// ─────────────────────────────────────────────────────────────────────────────
// WEATHER FETCH — uses free /forecast endpoint, no onecall needed
// ─────────────────────────────────────────────────────────────────────────────
async function fetchWeather(lat, lon) {
    try {
        const [curr, fore] = await Promise.all([
            fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${KEY}&units=metric`).then(r=>r.json()),
            fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${KEY}&units=metric&cnt=40`).then(r=>r.json()),
        ]);

        document.getElementById('city').textContent = (curr.name||'WEATHER').toUpperCase();

        // Hourly: use all 3-hourly slots, label by hour
        hourly = (fore.list||[]).slice(0,16).map(item => ({
            dt:   item.dt,
            temp: item.main.temp,
            icon: item.weather[0].icon,
            cond: item.weather[0].main,
        }));

        // Daily: group by day, pick midday slot or average
        const dayMap = {};
        (fore.list||[]).forEach(item => {
            const d = new Date(item.dt*1000);
            const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
            if (!dayMap[key]) dayMap[key] = [];
            dayMap[key].push(item);
        });
        daily = Object.values(dayMap).slice(0,7).map(slots => {
            const temps = slots.map(s=>s.main.temp);
            // pick midday slot (12:00) or first slot
            const mid = slots.find(s => new Date(s.dt*1000).getHours()===12) || slots[Math.floor(slots.length/2)];
            return {
                dt:   mid.dt,
                high: Math.round(Math.max(...temps)),
                low:  Math.round(Math.min(...temps)),
                temp: mid.main.temp,
                icon: mid.weather[0].icon,
                cond: mid.weather[0].main,
            };
        });

        // Preload icons
        [...hourly,...daily].forEach(d=>getIcon(d.icon));

        const t = Math.round(curr.main.temp);
        const c = curr.weather[0].main;
        document.getElementById('condition').textContent = c;
        build3D(c, t);
        panX = 0;
        draw();
    } catch(err) {
        console.warn('API error, using fallback', err);
        useFallback();
    }
}

function useFallback() {
    const now = Date.now()/1000;
    const icons_ = ['04n','02d','10d','13d','01d'];
    hourly = Array.from({length:16},(_,i)=>({
        dt: now+i*10800, temp: -2+Math.sin(i*.6)*5,
        icon: icons_[i%5], cond:'Clouds'
    }));
    daily = Array.from({length:7},(_,i)=>({
        dt: now+i*86400, high:-1+i, low:-13+i, temp:-3+i,
        icon: icons_[i%5], cond:'Clouds'
    }));
    hourly.forEach(d=>getIcon(d.icon));
    daily.forEach(d=>getIcon(d.icon));
    document.getElementById('condition').textContent = 'Clouds';
    build3D('Clouds', -2);
    draw();
}

function startFetch() {
    navigator.geolocation.getCurrentPosition(
        p => fetchWeather(p.coords.latitude, p.coords.longitude),
        ()  => fetchWeather(59.1936, 17.3654),
        {timeout:6000}
    );
}

// ─────────────────────────────────────────────────────────────────────────────
// CANVAS DRAW
// ─────────────────────────────────────────────────────────────────────────────
const fc  = document.getElementById('fc');
const ctx = fc.getContext('2d');

function resizeFC() {
    fc.width  = window.innerWidth;
    fc.height = CH;
    draw();
}

function getData() { return zoom > .5 ? hourly : daily; }

function getTemp(d) {
    return typeof d.temp === 'number' ? d.temp : d.high;
}

function colW() {
    // daily: show 7 cols; hourly: show 5 cols
    return zoom > .5 ? fc.width/5 : fc.width/7;
}

function colX(i) { return fc.width/2 + panX + i*colW(); }

function clampPan() {
    const data = getData();
    if (!data.length) return;
    const max = 0;
    const min = -(data.length-1)*colW();
    panX = Math.max(min, Math.min(max, panX));
}

function centerIdx() {
    const data = getData();
    const W2 = fc.width/2;
    let best=0, bestD=Infinity;
    data.forEach((_,i)=>{
        const d = Math.abs(colX(i)-W2);
        if(d<bestD){bestD=d;best=i;}
    });
    return best;
}

function drawPill(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.arc(x+w-r, y+r, r, -Math.PI/2, 0);
    ctx.lineTo(x+w, y+h-r);
    ctx.arc(x+w-r, y+h-r, r, 0, Math.PI/2);
    ctx.lineTo(x+r, y+h);
    ctx.arc(x+r, y+h-r, r, Math.PI/2, Math.PI);
    ctx.lineTo(x, y+r);
    ctx.arc(x+r, y+r, r, Math.PI, -Math.PI/2);
    ctx.closePath();
}

function draw() {
    const W = fc.width, H = fc.height;
    ctx.clearRect(0,0,W,H);

    const data = getData();
    if (!data.length) return;

    const isH   = zoom > .5;
    const PAD   = 16;
    const pX=PAD, pY=4, pW=W-PAD*2, pH=H-36;
    const pillR  = 22; // fixed radius, not half-height

    // ── Background pill — always dark
    drawPill(pX, pY, pW, pH, pillR);
    ctx.fillStyle = isH
        ? `rgba(38,38,44,0.96)`     // dark hourly
        : `rgba(30,30,36,0.92)`;    // dark daily
    ctx.fill();

    // subtle border
    drawPill(pX, pY, pW, pH, pillR);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // ── Clip inside pill
    ctx.save();
    drawPill(pX, pY, pW, pH, pillR);
    ctx.clip();

    // temp range
    const temps  = data.map(getTemp);
    const minT   = Math.min(...temps), maxT = Math.max(...temps);
    const tRng   = Math.max(maxT-minT, 1);

    // Layout zones inside pill
    const iconZoneTop = pY + 10;
    const iconZoneH   = 36;
    const curveTop    = pY + iconZoneH + 14;
    const curveBot    = pY + pH - 38;
    const cH          = Math.max(curveBot - curveTop, 10);
    const tempZoneY   = pY + pH - 34;

    const ty = t => curveBot - ((t-minT)/tRng)*cH;

    // ── Temperature curve
    ctx.beginPath();
    data.forEach((d,i)=>{
        const x=colX(i), y=ty(getTemp(d));
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth=1.5; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.stroke();

    const ci = centerIdx();

    data.forEach((d,i)=>{
        const x = colX(i);
        if (x < pX - colW()*1.5 || x > pX + pW + colW()*1.5) return;

        const t    = getTemp(d);
        const y    = ty(t);
        const dist = Math.abs(i-ci);
        const fade = Math.max(.15, 1 - dist * 0.32);

        // Dot on curve
        ctx.beginPath();
        ctx.arc(x, y, dist===0 ? 4 : 2.5, 0, Math.PI*2);
        ctx.fillStyle = dist===0 ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.3)';
        ctx.fill();

        // Icon above curve
        const img = getIcon(d.icon);
        const sz  = dist===0 ? 40 : 32;
        if (img) {
            ctx.globalAlpha = fade;
            ctx.drawImage(img, x - sz/2, y - sz - 6, sz, sz);
            ctx.globalAlpha = 1;
        }

        // Temperature below curve
        ctx.globalAlpha = fade;
        const fSize = dist===0 ? (isH?28:20) : (isH?20:16);
        ctx.font = `bold ${fSize}px -apple-system,sans-serif`;
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.textAlign  = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(`${Math.round(t)}°`, x, tempZoneY);

        // Low temp in daily mode
        if (!isH && d.low != null) {
            ctx.font = `500 ${dist===0?13:11}px -apple-system,sans-serif`;
            ctx.fillStyle = 'rgba(255,255,255,.35)';
            ctx.fillText(`${d.low}°`, x, tempZoneY + (dist===0?20:16));
        }

        ctx.globalAlpha = 1;
    });

    ctx.restore();

    // ── Time labels below pill
    data.forEach((d,i)=>{
        const x = colX(i);
        if (x < PAD - colW() || x > W - PAD + colW()) return;
        const dist = Math.abs(i-ci);
        const fade = Math.max(.2, 1 - dist * 0.28);
        const date = new Date(d.dt*1000);
        let lbl;
        if (zoom > .5) {
            lbl = i===0 ? 'NOW' : String(date.getHours()).padStart(2,'0');
        } else {
            lbl = i===0 ? 'TODAY' : date.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase();
        }
        ctx.globalAlpha = fade;
        ctx.font = `${dist===0?'700':'500'} 10px -apple-system,sans-serif`;
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(lbl, x, pY + pH + 7);
        ctx.globalAlpha = 1;
    });
}

// ─────────────────────────────────────────────────────────────────────────────
// UPDATE CENTER → update 3D + label
// ─────────────────────────────────────────────────────────────────────────────
let lastCond='', lastTemp=0;
function updateCenter() {
    const data = getData();
    if (!data.length) return;
    const d = data[centerIdx()];
    const t = Math.round(getTemp(d));
    const c = d.cond||'Clear';
    if (c!==lastCond || t!==lastTemp) {
        lastCond=c; lastTemp=t;
        document.getElementById('condition').textContent = c;
        build3D(c, t);
    }
    const h = document.getElementById('hint');
    h.textContent = zoom<.3?'DAILY · DRAG ↕ TO ZOOM IN':zoom>.7?'HOURLY · DRAG ↕ TO ZOOM OUT':'ZOOMING…';
}

// ─────────────────────────────────────────────────────────────────────────────
// GESTURES
// ─────────────────────────────────────────────────────────────────────────────
let gOn=false, gDir=null, gX0=0, gY0=0, gPan0=0, gZoom0=0, lastCol=-1;

function gStart(x,y) {
    gOn=true; gDir=null;
    gX0=x; gY0=y;
    gPan0=panX; gZoom0=zoom;
    beep(700,.05);
}
function gMove(x,y) {
    if(!gOn) return;
    const dx=x-gX0, dy=y-gY0;
    if(!gDir && (Math.abs(dx)>7||Math.abs(dy)>7))
        gDir = Math.abs(dx)>Math.abs(dy)?'h':'v';

    if(gDir==='h') {
        panX = gPan0+dx;
        clampPan();
        const col = Math.round(-panX/colW());
        if(col!==lastCol){ lastCol=col; beep(550,.035,.05); }
    } else if(gDir==='v') {
        const newZoom = Math.max(0,Math.min(1, gZoom0-dy/170));
        // reset pan when crossing boundary
        if((newZoom>.5)!==(gZoom0>.5)){ panX=0; gPan0=0; }
        zoom = newZoom;
        beep(350+zoom*350,.05,.04);
    }
    draw(); updateCenter();
}
function gEnd() {
    if(!gOn) return;
    gOn=false; gDir=null;
    // snap zoom
    const target = zoom>.5?1:0;
    animSnap(target);
}

function animSnap(target) {
    const from=zoom, t0=performance.now(), dur=280;
    (function step(now){
        const p=Math.min(1,(now-t0)/dur);
        const e=1-Math.pow(1-p,3);
        zoom=from+(target-from)*e;
        clampPan(); draw(); updateCenter();
        if(p<1) requestAnimationFrame(step);
    })(t0);
}

// Touch (iPhone priority - must use non-passive for prevent default to work)
fc.addEventListener('touchstart',  e=>{e.preventDefault();gStart(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
fc.addEventListener('touchmove',   e=>{e.preventDefault();gMove(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
fc.addEventListener('touchend',    e=>{e.preventDefault();gEnd();                                            },{passive:false});
fc.addEventListener('touchcancel', e=>{gOn=false;},{passive:false});

// Mouse (desktop)
fc.addEventListener('mousedown', e=>gStart(e.clientX,e.clientY));
window.addEventListener('mousemove', e=>{if(gOn)gMove(e.clientX,e.clientY);});
window.addEventListener('mouseup', ()=>gEnd());

// ─────────────────────────────────────────────────────────────────────────────
// THREE.JS
// ─────────────────────────────────────────────────────────────────────────────
let scene,cam,ren,grp;
let d3=false,lastAct=Date.now(),z3=1,font3=null;

function mat3(colorHex, grain=35) {
    const cv=document.createElement('canvas'); cv.width=cv.height=512;
    const cx=cv.getContext('2d');
    const r=(colorHex>>16)&255, g=(colorHex>>8)&255, b=colorHex&255;
    cx.fillStyle=`rgb(${r},${g},${b})`; cx.fillRect(0,0,512,512);
    const id=cx.getImageData(0,0,512,512);
    for(let i=0;i<id.data.length;i+=4){
        const n=(Math.random()-.5)*grain;
        id.data[i]=Math.max(0,Math.min(255,r+n));
        id.data[i+1]=Math.max(0,Math.min(255,g+n));
        id.data[i+2]=Math.max(0,Math.min(255,b+n));
        id.data[i+3]=255;
    }
    cx.putImageData(id,0,0);
    const tex=new THREE.CanvasTexture(cv);
    return new THREE.MeshStandardMaterial({map:tex,roughness:.92,metalness:.05,bumpMap:tex,bumpScale:.5,color:colorHex});
}

function sphere(r,mat,x=0,y=0,z=0){
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,32,32),mat);
    m.position.set(x,y,z); m.castShadow=true; return m;
}
function box(w,h,d,mat,x=0,y=0,z=0){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    m.position.set(x,y,z); m.castShadow=true; return m;
}
function cyl(rt,rb,h,mat,x=0,y=0,z=0){
    const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,32),mat);
    m.position.set(x,y,z); m.castShadow=true; return m;
}

// ── Weather shape builders ────────────────────────────────────────────────────
function makeCloud(m) {
    const g=new THREE.Group();
    [{x:0,y:0,z:0,r:5},{x:-4.5,y:0,z:-.5,r:4},{x:4.5,y:0,z:-.5,r:4},
     {x:-2,y:3.2,z:0,r:3.5},{x:2,y:3.2,z:0,r:3.5},
     {x:-6.5,y:-1,z:.5,r:2.2},{x:6.5,y:-1,z:.5,r:2.2}]
    .forEach(p=>g.add(sphere(p.r,m,p.x,p.y,p.z)));
    return g;
}

function makeSun(m) {
    const g=new THREE.Group();
    // Main disc
    g.add(sphere(5.5,m));
    // Rays
    for(let i=0;i<8;i++){
        const angle=i*(Math.PI/4);
        const ray=new THREE.Mesh(new THREE.CylinderGeometry(.5,.7,3.5,12),m);
        ray.position.set(Math.cos(angle)*8.5, Math.sin(angle)*8.5, 0);
        ray.rotation.z = angle + Math.PI/2;
        ray.castShadow=true;
        g.add(ray);
    }
    return g;
}

function makePartlyCloud(mSun, mCloud) {
    const g=new THREE.Group();
    // Sun peeking behind
    const sun=new THREE.Group();
    sun.add(sphere(4,mSun));
    for(let i=0;i<6;i++){
        const a=i*(Math.PI/3);
        const ray=new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,2.5,10),mSun);
        ray.position.set(Math.cos(a)*6.5, Math.sin(a)*6.5, -1);
        ray.rotation.z=a+Math.PI/2; ray.castShadow=true; sun.add(ray);
    }
    sun.position.set(3,3,-.5); g.add(sun);
    // Small cloud in front
    const cl=new THREE.Group();
    [{x:0,y:0,z:0,r:3.8},{x:-3.2,y:.3,z:-.3,r:3},{x:3.2,y:.3,z:-.3,r:3},
     {x:-1.5,y:2.4,z:0,r:2.6},{x:1.5,y:2.4,z:0,r:2.6}]
    .forEach(p=>cl.add(sphere(p.r,mCloud,p.x,p.y,p.z)));
    cl.position.set(-2,-2,1); g.add(cl);
    return g;
}

function makeRain(mCloud, mRain) {
    const g=new THREE.Group();
    const cl=makeCloud(mCloud);
    cl.position.set(0,3,0); g.add(cl);
    // Raindrops
    const drops=[[-.3,0],[2.5,-.3],[-2,-.5],[1,-1],[-.5,-1.5],[2,-1.8],[-2.5,-1.2]];
    drops.forEach(([ox,oy])=>{
        const drop=cyl(.18,.1,2.2,mRain,ox,-4+oy,0);
        drop.rotation.z=.08; g.add(drop);
    });
    return g;
}

function makeSnow(mCloud, mSnow) {
    const g=new THREE.Group();
    const cl=makeCloud(mCloud);
    cl.position.set(0,3,0); g.add(cl);
    // Snowflakes as small spheres
    const flakes=[[0,-4.5],[2.2,-3.8],[-2,-4.2],[1.2,-5.5],[-1.5,-5],[2.8,-5.2],[-2.8,-3.5]];
    flakes.forEach(([ox,oy])=>{
        g.add(sphere(.55,mSnow,ox,oy,0));
        g.add(sphere(.35,mSnow,ox+.7,oy-.4,0));
        g.add(sphere(.35,mSnow,ox-.7,oy-.4,0));
    });
    return g;
}

function makeThunder(mCloud, mBolt) {
    const g=new THREE.Group();
    const cl=makeCloud(mCloud);
    cl.position.set(0,3,0); g.add(cl);
    // Lightning bolt shape from boxes
    const boltParts=[
        {x:.5,y:-1.5,w:1.2,h:2.5,rot:.15},
        {x:-.5,y:-4,w:1.2,h:2.5,rot:.15},
    ];
    boltParts.forEach(p=>{
        const b=new THREE.Mesh(new THREE.BoxGeometry(p.w,p.h,.6),mBolt);
        b.position.set(p.x,p.y,0); b.rotation.z=p.rot; b.castShadow=true; g.add(b);
    });
    return g;
}

function makeMist(mMist) {
    const g=new THREE.Group();
    // Horizontal streaks
    [[-2,3.5,0],[2,1.5,0],[-3,-.5,0],[1,-2,0],[-1,-4,0]].forEach(([x,y,z])=>{
        const streak=new THREE.Mesh(new THREE.CylinderGeometry(1,.8,9,12),mMist);
        streak.rotation.z=Math.PI/2; streak.position.set(x,y,z); streak.castShadow=true; g.add(streak);
    });
    return g;
}

// ── Main build3D ─────────────────────────────────────────────────────────────
function build3D(cond, temp) {
    if(!grp||!font3) return;
    while(grp.children.length) grp.remove(grp.children[0]);

    const C = cond.toLowerCase();

    // Pick material colors per condition
    let shape;
    if (C.includes('clear') || C.includes('sunny')) {
        const mSun = mat3(0x4a3a20, 40); // warm golden-brown
        shape = makeSun(mSun);
    } else if (C.includes('few clouds') || C.includes('partly')) {
        const mSun   = mat3(0x4a3a20, 38);
        const mCloud = mat3(0x3a3a40, 35);
        shape = makePartlyCloud(mSun, mCloud);
    } else if (C.includes('thunder') || C.includes('storm')) {
        const mCloud = mat3(0x252530, 30);
        const mBolt  = mat3(0x4a4a20, 45); // yellowish bolt
        shape = makeThunder(mCloud, mBolt);
    } else if (C.includes('drizzle') || C.includes('rain')) {
        const mCloud = mat3(0x2e2e38, 30);
        const mRain  = mat3(0x203040, 25);
        shape = makeRain(mCloud, mRain);
    } else if (C.includes('snow') || C.includes('sleet') || C.includes('blizzard')) {
        const mCloud = mat3(0x353540, 28);
        const mSnow  = mat3(0x4a4a55, 20);
        shape = makeSnow(mCloud, mSnow);
    } else if (C.includes('mist') || C.includes('fog') || C.includes('haze') || C.includes('smoke') || C.includes('dust') || C.includes('sand')) {
        const mMist  = mat3(0x303038, 22);
        shape = makeMist(mMist);
    } else {
        // Default: cloud
        const mCloud = mat3(0x3a3a40, 35);
        shape = makeCloud(mCloud);
    }

    shape.position.set(0, 5, 0);
    grp.add(shape);

    // ── Temperature number
    const m = mat3(0x3a3a40, 35);
    const tg=new THREE.TextGeometry(String(temp),{
        font:font3,size:14,height:3,curveSegments:12,
        bevelEnabled:true,bevelThickness:.3,bevelSize:.2,bevelSegments:5
    });
    tg.center();
    const tm=new THREE.Mesh(tg,m); tm.position.set(0,-8,0); tm.castShadow=true; grp.add(tm);

    // ── Degree symbol
    const dg=new THREE.TextGeometry('°',{font:font3,size:6,height:2,curveSegments:12,bevelEnabled:true,bevelThickness:.2,bevelSize:.1,bevelSegments:5});
    const dm=new THREE.Mesh(dg,m); dm.position.set(11,-5,0); grp.add(dm);

    // ── Condition text
    const cg=new THREE.TextGeometry(cond.toUpperCase(),{
        font:font3,size:4,height:1.5,curveSegments:8,
        bevelEnabled:true,bevelThickness:.15,bevelSize:.1,bevelSegments:3
    });
    cg.center();
    const cm=new THREE.Mesh(cg,m); cm.position.set(0,-18,0); cm.castShadow=true; grp.add(cm);
}

function init3D() {
    const cv=document.getElementById('canvas3d');
    scene=new THREE.Scene();
    cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,1,1000);
    cam.position.set(0,5,65);
    ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
    ren.setSize(innerWidth,innerHeight);
    ren.setPixelRatio(Math.min(devicePixelRatio,2));
    ren.shadowMap.enabled=true;
    scene.add(new THREE.AmbientLight(0xffffff,.5));
    const ml=new THREE.DirectionalLight(0xffffff,1.2); ml.position.set(10,20,15); ml.castShadow=true; scene.add(ml);
    const fl=new THREE.DirectionalLight(0x8888ff,.4); fl.position.set(-15,-10,10); scene.add(fl);
    const rl=new THREE.DirectionalLight(0xffffff,.5); rl.position.set(-5,5,-10); scene.add(rl);
    grp=new THREE.Group(); scene.add(grp);

    // 3D touch controls
    let prev={x:0,y:0},ld=0;
    cv.addEventListener('touchstart',e=>{
        if(e.touches.length===1){d3=true;prev={x:e.touches[0].clientX,y:e.touches[0].clientY};}
        if(e.touches.length===2){d3=false;const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;ld=Math.sqrt(dx*dx+dy*dy);}
    });
    cv.addEventListener('touchmove',e=>{
        if(e.touches.length===1&&d3){const t=e.touches[0];grp.rotation.y+=(t.clientX-prev.x)*.01;grp.rotation.x=Math.max(-Math.PI/4,Math.min(Math.PI/4,grp.rotation.x+(t.clientY-prev.y)*.01));prev={x:t.clientX,y:t.clientY};lastAct=Date.now();}
        if(e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,dist=Math.sqrt(dx*dx+dy*dy);if(ld>0){z3=Math.max(.5,Math.min(2.5,z3*(1+(dist-ld)*.005)));grp.scale.setScalar(z3);}ld=dist;lastAct=Date.now();}
    },{passive:false});
    cv.addEventListener('touchend',()=>{d3=false;ld=0;});
    cv.addEventListener('mousedown',e=>{d3=true;prev={x:e.clientX,y:e.clientY};});
    window.addEventListener('mousemove',e=>{if(!d3)return;grp.rotation.y+=(e.clientX-prev.x)*.01;grp.rotation.x=Math.max(-Math.PI/4,Math.min(Math.PI/4,grp.rotation.x+(e.clientY-prev.y)*.01));prev={x:e.clientX,y:e.clientY};lastAct=Date.now();});
    window.addEventListener('mouseup',()=>d3=false);
    cv.addEventListener('wheel',e=>{e.preventDefault();z3=Math.max(.5,Math.min(2.5,z3+(e.deltaY>0?-1:1)*.05));grp.scale.setScalar(z3);lastAct=Date.now();},{passive:false});
    window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);resizeFC();});

    (function loop(){requestAnimationFrame(loop);if(!d3&&Date.now()-lastAct>2000)grp.rotation.y+=.0008;ren.render(scene,cam);})();

    new THREE.FontLoader().load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', f=>{
        font3=f;
        startFetch();
    });
}

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
resizeFC();
init3D();
</script>
</body>
</html>
